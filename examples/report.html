    const COLORS = {
      entry: "#f59e0b",
      core: "#3b82f6",
      modes: "#8b5cf6",
      refactor: "#ec4899",
      semantic: "#14b8a6",
      formal: "#f97316",
      reporters: "#22c55e",
      "ci-cd": "#06b6d4",
      "hybrid-report": "#a78bfa",
      utils: "#64748b",
      root: "#94a3b8",
      external: "#ef4444"
    };
    const LABELS = {
      entry: "Точка входа",
      core: "core",
      modes: "modes",
      refactor: "refactor",
      semantic: "semantic",
      formal: "formal",
      reporters: "reporters",
      "ci-cd": "ci-cd",
      utils: "utils",
      root: "src",
      external: "npm"
    };

    const fmtSize = (n) => !n ? "—" : n > 1048576 ? (n / 1048576).toFixed(2) + " МБ" : n > 1024 ? (n / 1024).toFixed(1) + " КБ" : n + " Б";
    const basename = (id) => id.split("/").pop();
    const modules = Object.values(DATA.modules);
    const internalCount = modules.filter((m) => m.group !== "external").length;
    const externalCount = modules.filter((m) => m.group === "external").length;

    document.getElementById("stats").innerHTML = [
      ["Модули", DATA.summary.totalModules ?? internalCount],
      ["Рёбра", DATA.edges.length],
      ["Внешние пакеты", externalCount],
      ["Функции", DATA.entityStats.totalFunctions ?? "—"],
      ["Классы", DATA.entityStats.totalClasses ?? "—"],
      ["Строки", (DATA.fileStats.totalLines ?? 0).toLocaleString("ru-RU")],
      ["Размер", fmtSize(DATA.fileStats.totalSize)],
      ["Циклы", DATA.summary.hasCycles ? "есть" : "нет"],
      ["Глубина", DATA.summary.maxDepth ?? "—"],
      ["Здоровье", DATA.summary.architectureHealth || "—"]
    ].map(([k, v]) => '<div class="stat"><b' + (k === "Здоровье" ? ' class="ok"' : "") + ">" + v + "</b><span>" + k + "</span></div>").join("");

    const groups = [...new Set(modules.map((m) => m.group))].sort();
    const groupFilter = document.getElementById("groupFilter");
    for (const g of groups) {
      const opt = document.createElement("option");
      opt.value = g;
      opt.textContent = LABELS[g] || g;
      groupFilter.appendChild(opt);
    }
    document.getElementById("legend").innerHTML = groups.map((g) =>
      '<span class="chip"><span class="dot" style="background:' + (COLORS[g] || "#888") + '"></span>' + (LABELS[g] || g) + "</span>"
    ).join("");

    let network;
    let nodesDS;
    let edgesDS;
    let selectedId = null;

    function visibleModules() {
      const q = document.getElementById("search").value.trim().toLowerCase();
      const group = groupFilter.value;
      const showExt = document.getElementById("externals").checked;
      return modules.filter((m) => {
        if (!showExt && m.group === "external") return false;
        if (group && m.group !== group) return false;
        if (q && !m.id.toLowerCase().includes(q)) return false;
        return true;
      });
    }

    function build() {
      const visible = visibleModules();
      const ids = new Set(visible.map((m) => m.id));
      const nodes = visible.map((m) => {
        const degree = m.dependencies.length + m.dependents.length;
        return {
          id: m.id,
          label: basename(m.id),
          title: m.id,
          group: m.group,
          value: Math.max(8, degree + (m.fileStats?.lines || 0) / 80),
          shape: m.group === "external" ? "diamond" : m.isEntry ? "star" : "dot",
          color: {
            background: COLORS[m.group] || "#888",
            border: m.isEntry ? "#fff3c4" : "#0b1020",
            highlight: { background: "#fff", border: COLORS[m.group] || "#888" }
          },
          font: { color: "#e8eefc", size: 12 }
        };
      });
      const edges = DATA.edges
        .filter((e) => ids.has(e.from) && ids.has(e.to))
        .map((e, i) => ({
          id: "e" + i,
          from: e.from,
          to: e.to,
          arrows: "to",
          color: { color: "#3a4a73", highlight: "#7aa2ff" },
          smooth: { type: "dynamic" }
        }));

      const hier = document.getElementById("layout").value === "hierarchical";
      const options = {
        nodes: { borderWidth: 2, scaling: { min: 10, max: 42 } },
        edges: { width: 1, selectionWidth: 2 },
        physics: hier ? false : {
          enabled: true,
          solver: "forceAtlas2Based",
          forceAtlas2Based: { gravitationalConstant: -46, springLength: 110, springConstant: 0.06 },
          stabilization: { iterations: 180 }
        },
        layout: hier ? { hierarchical: { enabled: true, direction: "UD", sortMethod: "directed", nodeSpacing: 140, levelSeparation: 110 } } : { hierarchical: false },
        interaction: { hover: true, tooltipDelay: 80, multiselect: false, navigationButtons: true, keyboard: true }
      };

      const container = document.getElementById("graph");
      if (!network) {
        nodesDS = new vis.DataSet(nodes);
        edgesDS = new vis.DataSet(edges);
        network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, options);
        network.on("click", (params) => {
          if (params.nodes[0]) showDetails(params.nodes[0]);
        });
        network.on("doubleClick", (params) => {
          if (params.nodes[0]) focusNeighborhood(params.nodes[0]);
        });
      } else {
        network.setOptions(options);
        nodesDS.clear();
        edgesDS.clear();
        nodesDS.add(nodes);
        edgesDS.add(edges);
      }
    }

    function showDetails(id) {
      selectedId = id;
      const m = DATA.modules[id];
      if (!m) return;
      const link = (x) => '<li><a data-id="' + x + '">' + x + "</a></li>";
      document.getElementById("details").innerHTML = [
        "<h2>" + m.id + "</h2>",
        '<div class="meta">' + (LABELS[m.group] || m.group) + " · " + m.language + (m.isEntry ? " · точка входа" : "") + "</div>",
        m.fileStats ? "<p>Строк: <b>" + m.fileStats.lines + "</b> · размер: <b>" + fmtSize(m.fileStats.size) + "</b> · функции: <b>" + m.functions + "</b> · классы: <b>" + m.classes + "</b> · интерфейсы: <b>" + m.interfaces + "</b> · экспорты: <b>" + m.exportCount + "</b></p>" : "<p class=\"empty\">Внешний пакет</p>",
        "<h3>Зависит от (" + m.dependencies.length + ")</h3>",
        m.dependencies.length ? '<ul class="list">' + m.dependencies.map(link).join("") + "</ul>" : '<p class="empty">нет</p>',
        "<h3>Используется в (" + m.dependents.length + ")</h3>",
        m.dependents.length ? '<ul class="list">' + m.dependents.map(link).join("") + "</ul>" : '<p class="empty">нет</p>',
        m.exports.length ? "<h3>Экспорты</h3><ul class=\"list\">" + m.exports.map((x) => "<li>" + x + "</li>").join("") + "</ul>" : ""
      ].join("");
      document.querySelectorAll("#details a[data-id]").forEach((a) => {
        a.addEventListener("click", () => {
          const nid = a.getAttribute("data-id");
          if (!DATA.modules[nid]) return;
          network.selectNodes([nid]);
          network.focus(nid, { scale: 1.15, animation: true });
          showDetails(nid);
        });
      });
    }

    function focusNeighborhood(id) {
      const m = DATA.modules[id];
      if (!m) return;
      const keep = new Set([id, ...m.dependencies, ...m.dependents]);
      nodesDS.forEach((n) => {
        nodesDS.update({ id: n.id, hidden: !keep.has(n.id) });
      });
      network.focus(id, { scale: 1.2, animation: true });
      showDetails(id);
    }

    document.getElementById("search").addEventListener("input", build);
    groupFilter.addEventListener("change", build);
    document.getElementById("layout").addEventListener("change", build);
    document.getElementById("externals").addEventListener("change", build);
    document.getElementById("fit").addEventListener("click", () => network && network.fit({ animation: true }));
    document.getElementById("reset").addEventListener("click", () => {
      document.getElementById("search").value = "";
      groupFilter.value = "";
      document.getElementById("externals").checked = true;
      build();
      network.fit({ animation: true });
    });

    build();
  </script>
</body>
</html>
