<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Интерактивный граф ast-analyzer 3.0.0</title>
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <style>
      :root {
          --bg: #0b1020;
          --panel: #121a2f;
          --panel-2: #18233d;
          --border: #2a3658;
          --text: #e8eefc;
          --muted: #93a0c2;
          --accent: #7aa2ff;
          --fn-color: #fbbf24;
          --const-color: #f472b6;
          --interface-color: #a78bfa;
          --type-color: #22d3ee;
          --class-color: #4ade80;
          --var-color: #f87171;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 Inter, Segoe UI, system-ui, sans-serif; }
      body { display: grid; grid-template-rows: auto auto 1fr; }
      header {
          padding: 16px 20px 12px;
          border-bottom: 1px solid var(--border);
          background: linear-gradient(180deg, #151d34, #0f1629);
      }
      header h1 { margin: 0 0 4px; font-size: 20px; font-weight: 650; }
      header p { margin: 0; color: var(--muted); }
      .stats {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
          gap: 8px;
          padding: 10px 20px;
          border-bottom: 1px solid var(--border);
          background: #10182c;
      }
      .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
      .stat b { display: block; font-size: 18px; }
      .stat span { color: var(--muted); font-size: 12px; }
      .ok { color: #4ade80; }
      .layout { display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
      #graph { min-height: 0; background: #0b1020; border-radius: 8px; }
      aside {
          border-left: 1px solid var(--border);
          background: var(--panel);
          padding: 12px;
          overflow: auto;
          max-height: calc(100vh - 200px);
      }
      .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
      input, select, button {
          background: var(--panel-2);
          color: var(--text);
          border: 1px solid var(--border);
          border-radius: 8px;
          padding: 6px 10px;
          font-size: 12px;
      }
      input { flex: 1; min-width: 120px; }
      button { cursor: pointer; }
      button:hover { border-color: var(--accent); }
      .legend { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
      .chip { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 11px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
      .details h2 { margin: 0 0 6px; font-size: 14px; word-break: break-all; }
      .meta { color: var(--muted); margin-bottom: 8px; font-size: 12px; }
      .list { margin: 0; padding: 0 0 0 14px; font-size: 12px; }
      .list li { margin: 2px 0; word-break: break-all; }
      .list a { color: var(--accent); cursor: pointer; text-decoration: none; }
      .list a:hover { text-decoration: underline; }
      .hint { color: var(--muted); font-size: 12px; }
      .empty { color: var(--muted); font-style: italic; }
      .entity-badge {
          display: inline-block;
          font-size: 9px;
          padding: 0 6px;
          border-radius: 4px;
          margin-right: 4px;
          font-weight: 600;
      }
      .badge-fn { background: #fbbf24; color: #0f172a; }
      .badge-const { background: #f472b6; color: #0f172a; }
      .badge-interface { background: #a78bfa; color: #fff; }
      .badge-type { background: #22d3ee; color: #0f172a; }
      .badge-class { background: #4ade80; color: #0f172a; }
      .badge-var { background: #f87171; color: #fff; }
      .badge-module { background: #3b82f6; color: #fff; }
      .entity-list { max-height: 200px; overflow-y: auto; }
      .entity-list::-webkit-scrollbar { width: 4px; }
      .entity-list::-webkit-scrollbar-thumb { background: #2a3658; border-radius: 4px; }
      @media (max-width: 900px) {
          .layout { grid-template-columns: 1fr; grid-template-rows: 55vh auto; }
          aside { border-left: 0; border-top: 1px solid var(--border); max-height: none; }
      }
      .loading { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--muted); font-size: 18px; }
      .loading::after { content: '...'; animation: dots 1.5s steps(4, end) infinite; }
      @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
      .stats-filter { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
      .stats-filter .chip { font-size: 10px; cursor: pointer; padding: 2px 6px; border-radius: 4px; border: 1px solid transparent; }
      .stats-filter .chip.active { border-color: var(--accent); background: rgba(122, 162, 255, 0.1); }
      .stats-filter .chip .count { color: var(--muted); font-size: 9px; }
  </style>
</head>
<body>
<header>
  <h1>🔀 Интерактивный граф ast-analyzer 3.0.0</h1>
  <p id="headerInfo">Загрузка данных...</p>
</header>
<section class="stats" id="stats"></section>
<div class="layout">
  <div id="graph"><div class="loading">Загрузка графа</div></div>
  <aside>
    <div class="controls">
      <input id="search" placeholder="🔍 Поиск..." />
      <select id="entityTypeFilter">
        <option value="">Все сущности</option>
        <option value="module">Модули</option>
        <option value="function">Функции</option>
        <option value="constant">Константы</option>
        <option value="interface">Интерфейсы</option>
        <option value="type">Типы</option>
        <option value="class">Классы</option>
        <option value="variable">Переменные</option>
      </select>
      <select id="groupFilter">
        <option value="">Все группы</option>
      </select>
      <select id="layout">
        <option value="physics">Динамический</option>
        <option value="hierarchical">Иерархический</option>
      </select>
      <label class="chip"><input type="checkbox" id="showExternals" checked /> Внешние</label>
      <button id="fit">📐 Центрировать</button>
      <button id="reset">🔄 Сброс</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="details" id="details">
      <p class="hint">💡 Клик по узлу — подробности. Двойной клик — фокус на связанные узлы.</p>
    </div>
  </aside>
</div>
<script>
  // ============================================================
  // ЗАГРУЗКА ДАННЫХ
  // ============================================================
  const DATA_URL = 'package-lock-report.json';

  let REPORT_DATA = null;
  let ALL_ENTITIES = [];
  let NODES_CACHE = [];
  let EDGES_CACHE = [];

  // Цвета для типов сущностей
  const ENTITY_COLORS = {
    module: '#3b82f6',
    function: '#fbbf24',
    constant: '#f472b6',
    interface: '#a78bfa',
    type: '#22d3ee',
    class: '#4ade80',
    variable: '#f87171',
    external: '#ef4444'
  };

  const ENTITY_LABELS = {
    module: 'Модуль',
    function: 'Функция',
    constant: 'Константа',
    interface: 'Интерфейс',
    type: 'Тип',
    class: 'Класс',
    variable: 'Переменная',
    external: 'Внешний'
  };

  const ENTITY_ICONS = {
    module: '📁',
    function: 'ƒ',
    constant: '📌',
    interface: '📋',
    type: '📝',
    class: '📦',
    variable: '📄',
    external: '📦'
  };

  // ============================================================
  // ЗАГРУЗКА ДАННЫХ С СЕРВЕРА
  // ============================================================
  async function loadData() {
    try {
      const response = await fetch(DATA_URL);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      REPORT_DATA = data;
      return data;
    } catch (error) {
      console.error('❌ Ошибка загрузки данных:', error);
      // Показываем сообщение об ошибке
      document.getElementById('graph').innerHTML = `
          <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#f87171;flex-direction:column;gap:12px;padding:20px;text-align:center;">
            <div style="font-size:48px;">⚠️</div>
            <div>Не удалось загрузить данные</div>
            <div style="font-size:12px;color:var(--muted);">${error.message}</div>
            <button onclick="location.reload()" style="margin-top:8px;padding:8px 20px;background:var(--accent);color:#0f172a;border:none;border-radius:8px;cursor:pointer;">🔄 Попробовать снова</button>
          </div>
        `;
      return null;
    }
  }

  // ============================================================
  // ИЗВЛЕЧЕНИЕ ВСЕХ СУЩНОСТЕЙ ИЗ ДАННЫХ
  // ============================================================
  function extractAllEntities(data) {
    const entities = [];
    const packages = data.packages || {};

    for (const [modulePath, pkg] of Object.entries(packages)) {
      if (!pkg) continue;

      // Добавляем сам модуль как узел
      entities.push({
        id: modulePath,
        name: modulePath.split('/').pop() || modulePath,
        fullName: modulePath,
        type: 'module',
        module: modulePath,
        isEntry: pkg.isEntry || false,
        language: pkg.language || 'unknown',
        fileStats: pkg.fileStats || {},
        displayPath: pkg.displayPath || modulePath,
        exports: pkg.exports || {},
        imports: pkg.imports || {},
        entities: pkg.entities || {},
      });

      // Функции
      const functions = pkg.entities?.functions || [];
      for (const func of functions) {
        if (!func || !func.name) continue;
        entities.push({
          id: `${modulePath}#func:${func.name}`,
          name: func.name,
          fullName: func.name,
          type: 'function',
          module: modulePath,
          isExported: func.isExported || false,
          isAsync: func.isAsync || false,
          params: func.params || [],
          returnType: func.returnType || 'any',
          line: func.line || 0,
          calls: func.calls || [],
          calledBy: func.calledBy || [],
          complexity: func.complexity || 0,
          body: func.body || '',
          isMethod: func.isMethod || false,
          className: func.className || '',
        });
      }

      // Константы
      const constants = pkg.entities?.constants || [];
      for (const const_ of constants) {
        if (!const_ || !const_.name) continue;
        entities.push({
          id: `${modulePath}#const:${const_.name}`,
          name: const_.name,
          fullName: const_.name,
          type: 'constant',
          module: modulePath,
          isExported: const_.isExported || false,
          value: const_.value || '',
          line: const_.line || 0,
        });
      }

      // Интерфейсы
      const interfaces = pkg.entities?.interfaces || [];
      for (const interface_ of interfaces) {
        if (!interface_ || !interface_.name) continue;
        entities.push({
          id: `${modulePath}#interface:${interface_.name}`,
          name: interface_.name,
          fullName: interface_.name,
          type: 'interface',
          module: modulePath,
          isExported: interface_.isExported || false,
          properties: interface_.properties || [],
          extends: interface_.extends || [],
          line: interface_.line || 0,
        });
      }

      // Типы
      const types = pkg.entities?.types || [];
      for (const type of types) {
        if (!type || !type.name) continue;
        entities.push({
          id: `${modulePath}#type:${type.name}`,
          name: type.name,
          fullName: type.name,
          type: 'type',
          module: modulePath,
          isExported: type.isExported || false,
          definition: type.definition || '',
          line: type.line || 0,
        });
      }

      // Классы
      const classes = pkg.entities?.classes || [];
      for (const class_ of classes) {
        if (!class_ || !class_.name) continue;
        entities.push({
          id: `${modulePath}#class:${class_.name}`,
          name: class_.name,
          fullName: class_.name,
          type: 'class',
          module: modulePath,
          isExported: class_.isExported || false,
          extends: class_.extends || '',
          implements: class_.implements || [],
          methods: class_.methods || [],
          properties: class_.properties || [],
          line: class_.line || 0,
        });
      }

      // Переменные
      const variables = pkg.entities?.variables || [];
      for (const variable of variables) {
        if (!variable || !variable.name) continue;
        entities.push({
          id: `${modulePath}#var:${variable.name}`,
          name: variable.name,
          fullName: variable.name,
          type: 'variable',
          module: modulePath,
          isExported: variable.isExported || false,
          value: variable.value || '',
          line: variable.line || 0,
        });
      }
    }

    return entities;
  }

  // ============================================================
  // ПОСТРОЕНИЕ СВЯЗЕЙ МЕЖДУ СУЩНОСТЯМИ
  // ============================================================
  function buildEntityEdges(entities, data) {
    const edges = [];
    const entityMap = new Map();
    for (const e of entities) {
      entityMap.set(e.id, e);
    }

    // Связи: модуль -> сущности внутри него
    for (const e of entities) {
      if (e.type !== 'module') {
        edges.push({
          from: e.module,
          to: e.id,
          type: 'contains',
          label: 'содержит'
        });
      }
    }

    // Связи: вызовы функций
    for (const e of entities) {
      if (e.type === 'function' && e.calls) {
        for (const call of e.calls) {
          // Ищем вызываемую функцию
          const targetId = `${e.module}#func:${call}`;
          if (entityMap.has(targetId)) {
            edges.push({
              from: e.id,
              to: targetId,
              type: 'calls',
              label: '→'
            });
          } else {
            // Ищем в других модулях
            for (const [id, entity] of entityMap) {
              if (entity.type === 'function' && entity.name === call && entity.module !== e.module) {
                edges.push({
                  from: e.id,
                  to: id,
                  type: 'calls',
                  label: '→'
                });
                break;
              }
            }
          }
        }
      }
    }

    // Связи: импорты между модулями
    const packages = data.packages || {};
    for (const [modulePath, pkg] of Object.entries(packages)) {
      if (!pkg) continue;
      const imports = pkg.imports || {};
      for (const [importSource] of Object.entries(imports)) {
        if (entityMap.has(modulePath) && entityMap.has(importSource)) {
          // Проверяем, не добавлено ли уже
          const exists = edges.some(e =>
            e.from === modulePath && e.to === importSource && e.type === 'import'
          );
          if (!exists) {
            edges.push({
              from: modulePath,
              to: importSource,
              type: 'import',
              label: '←'
            });
          }
        }
      }
    }

    // Связи: наследование классов
    for (const e of entities) {
      if (e.type === 'class' && e.extends) {
        for (const ext of Array.isArray(e.extends) ? e.extends : [e.extends]) {
          const targetId = `${e.module}#class:${ext}`;
          if (entityMap.has(targetId)) {
            edges.push({
              from: e.id,
              to: targetId,
              type: 'extends',
              label: 'extends'
            });
          }
        }
      }
    }

    // Связи: реализация интерфейсов
    for (const e of entities) {
      if (e.type === 'class' && e.implements) {
        for (const impl of e.implements) {
          const targetId = `${e.module}#interface:${impl}`;
          if (entityMap.has(targetId)) {
            edges.push({
              from: e.id,
              to: targetId,
              type: 'implements',
              label: 'implements'
            });
          }
        }
      }
    }

    // Связи: расширение интерфейсов
    for (const e of entities) {
      if (e.type === 'interface' && e.extends) {
        for (const ext of e.extends) {
          const targetId = `${e.module}#interface:${ext}`;
          if (entityMap.has(targetId)) {
            edges.push({
              from: e.id,
              to: targetId,
              type: 'extends',
              label: 'extends'
            });
          }
        }
      }
    }

    // Удаляем дубликаты
    const uniqueEdges = [];
    const edgeSet = new Set();
    for (const e of edges) {
      const key = `${e.from}->${e.to}:${e.type}`;
      if (!edgeSet.has(key)) {
        edgeSet.add(key);
        uniqueEdges.push(e);
      }
    }

    return uniqueEdges;
  }

  // ============================================================
  // ФОРМИРОВАНИЕ ГРУПП
  // ============================================================
  function detectGroup(entity) {
    if (entity.type === 'module') {
      // Определяем группу по пути
      const path = entity.fullName || entity.id;
      if (path.includes('/core/')) return 'core';
      if (path.includes('/modes/')) return 'modes';
      if (path.includes('/refactor/')) return 'refactor';
      if (path.includes('/semantic/')) return 'semantic';
      if (path.includes('/formal/')) return 'formal';
      if (path.includes('/reporters/')) return 'reporters';
      if (path.includes('/ci-cd/')) return 'ci-cd';
      if (path.includes('/utils/')) return 'utils';
      if (path.includes('/types')) return 'types';
      if (entity.isEntry) return 'entry';
      return 'module';
    }
    return entity.type;
  }

  const GROUP_COLORS = {
    entry: '#f59e0b',
    core: '#3b82f6',
    modes: '#8b5cf6',
    refactor: '#ec4899',
    semantic: '#14b8a6',
    formal: '#f97316',
    reporters: '#22c55e',
    'ci-cd': '#06b6d4',
    utils: '#64748b',
    types: '#94a3b8',
    module: '#3b82f6',
    function: '#fbbf24',
    constant: '#f472b6',
    interface: '#a78bfa',
    type: '#22d3ee',
    class: '#4ade80',
    variable: '#f87171',
    external: '#ef4444'
  };

  const GROUP_LABELS = {
    entry: '⭐ Точка входа',
    core: '📦 Core',
    modes: '🔧 Modes',
    refactor: '♻️ Refactor',
    semantic: '🧠 Semantic',
    formal: '📐 Formal',
    reporters: '📊 Reporters',
    'ci-cd': '🚀 CI/CD',
    utils: '🛠 Utils',
    types: '📝 Types',
    module: '📁 Модуль',
    function: 'ƒ Функция',
    constant: '📌 Константа',
    interface: '📋 Интерфейс',
    type: '📝 Тип',
    class: '📦 Класс',
    variable: '📄 Переменная',
    external: '📦 Внешний'
  };

  // ============================================================
  // ПОСТРОЕНИЕ ГРАФА
  // ============================================================
  function buildGraph(entities, edges, filters) {
    const { search, group, entityType, showExternals } = filters;

    let filteredEntities = entities;

    // Фильтр по типу сущности
    if (entityType) {
      filteredEntities = filteredEntities.filter(e => e.type === entityType);
    }

    // Фильтр по группе
    if (group) {
      filteredEntities = filteredEntities.filter(e => detectGroup(e) === group);
    }

    // Фильтр по поиску
    if (search) {
      const q = search.toLowerCase();
      filteredEntities = filteredEntities.filter(e =>
        e.name.toLowerCase().includes(q) ||
        e.fullName.toLowerCase().includes(q) ||
        e.id.toLowerCase().includes(q)
      );
    }

    // Фильтр внешних модулей
    if (!showExternals) {
      filteredEntities = filteredEntities.filter(e =>
        e.type !== 'module' || !e.id.includes('node_modules')
      );
    }

    const nodeIds = new Set(filteredEntities.map(e => e.id));

    // Фильтруем ребра
    let filteredEdges = edges.filter(e =>
      nodeIds.has(e.from) && nodeIds.has(e.to)
    );

    // Для поиска расширяем граф
    if (search) {
      const searchIds = new Set(filteredEntities.map(e => e.id));
      // Добавляем связанные узлы
      for (const edge of edges) {
        if (searchIds.has(edge.from) && !searchIds.has(edge.to)) {
          const target = entities.find(e => e.id === edge.to);
          if (target) {
            filteredEntities.push(target);
            searchIds.add(edge.to);
          }
        }
        if (searchIds.has(edge.to) && !searchIds.has(edge.from)) {
          const source = entities.find(e => e.id === edge.from);
          if (source) {
            filteredEntities.push(source);
            searchIds.add(edge.from);
          }
        }
      }
      filteredEdges = edges.filter(e =>
        searchIds.has(e.from) && searchIds.has(e.to)
      );
    }

    // Строим узлы для vis-network
    const nodes = filteredEntities.map(e => {
      const group = detectGroup(e);
      const color = GROUP_COLORS[group] || '#94a3b8';
      const label = e.type === 'module'
        ? e.name
        : (e.isExported ? '📤 ' : '') + e.name;

      let size = 12;
      if (e.type === 'module') size = 18 + (e.isEntry ? 8 : 0);
      else if (e.type === 'function') size = 10 + (e.isExported ? 4 : 0) + (e.calls?.length || 0) * 0.5;
      else if (e.type === 'class') size = 12;
      else if (e.type === 'interface') size = 10;
      else size = 8;

      // Формируем title для тултипа
      let title = `<b>${e.name}</b>\n`;
      title += `Тип: ${ENTITY_LABELS[e.type] || e.type}\n`;
      if (e.type === 'module') {
        title += `Путь: ${e.fullName}\n`;
        title += `Язык: ${e.language || 'unknown'}\n`;
        if (e.isEntry) title += '⭐ Точка входа\n';
        if (e.fileStats) {
          title += `Строк: ${e.fileStats.lines || 0}\n`;
          title += `Размер: ${formatFileSize(e.fileStats.size || 0)}\n`;
        }
      } else {
        title += `Модуль: ${e.module}\n`;
        if (e.line) title += `Строка: ${e.line}\n`;
        if (e.isExported) title += '📤 Экспортирована\n';
        if (e.type === 'function') {
          if (e.isAsync) title += '⚡ Асинхронная\n';
          if (e.params?.length) title += `Параметры: ${e.params.join(', ')}\n`;
          if (e.returnType) title += `Возврат: ${e.returnType}\n`;
          if (e.calls?.length) title += `Вызовов: ${e.calls.length}\n`;
          if (e.calledBy?.length) title += `Кем вызвана: ${e.calledBy.length}\n`;
          if (e.complexity) title += `Сложность: ${e.complexity}\n`;
        }
        if (e.type === 'class') {
          if (e.extends) title += `Наследует: ${e.extends}\n`;
          if (e.implements?.length) title += `Реализует: ${e.implements.join(', ')}\n`;
          if (e.methods?.length) title += `Методов: ${e.methods.length}\n`;
        }
        if (e.type === 'interface' || e.type === 'type') {
          if (e.properties?.length) title += `Свойств: ${e.properties.length}\n`;
          if (e.extends?.length) title += `Расширяет: ${e.extends.join(', ')}\n`;
        }
      }
      title += `\n🖱 Клик для деталей`;

      return {
        id: e.id,
        label: label,
        title: title,
        group: group,
        value: Math.max(6, size),
        shape: e.type === 'module' ? (e.isEntry ? 'star' : 'dot') :
          e.type === 'function' ? 'dot' :
            e.type === 'class' ? 'box' :
              e.type === 'interface' ? 'diamond' :
                e.type === 'type' ? 'triangle' :
                  e.type === 'constant' ? 'square' : 'dot',
        color: {
          background: color,
          border: e.isEntry ? '#fbbf24' : '#0b1020',
          highlight: { background: '#fff', border: color }
        },
        font: { color: '#e8eefc', size: e.type === 'module' ? 12 : 10 },
        shapeProperties: {
          borderDashes: e.type === 'external' ? [3, 3] : false
        }
      };
    });

    // Строим ребра
    const visEdges = filteredEdges.map((e, i) => {
      const edgeColors = {
        contains: '#3b82f6',
        calls: '#f59e0b',
        import: '#3b82f6',
        extends: '#4ade80',
        implements: '#a78bfa'
      };
      const color = edgeColors[e.type] || '#3a4a73';
      return {
        id: 'e' + i,
        from: e.from,
        to: e.to,
        label: e.label || '',
        arrows: 'to',
        color: { color: color, highlight: '#7aa2ff' },
        smooth: { type: 'dynamic' },
        font: { size: 8, color: '#64748b' },
        width: e.type === 'calls' ? 1.5 : 1,
        dashes: e.type === 'import' ? [4, 4] : false
      };
    });

    return { nodes, edges: visEdges, entityData: filteredEntities };
  }

  // ============================================================
  // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
  // ============================================================
  function formatFileSize(bytes) {
    if (!bytes) return '0 B';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(2) + ' MB';
  }

  function basename(path) {
    if (!path) return '';
    const parts = path.split('/');
    return parts[parts.length - 1] || path;
  }

  function getEntityIcon(entity) {
    if (entity.type === 'module') return '📁';
    if (entity.isExported) return '📤';
    const icons = {
      function: 'ƒ',
      constant: '📌',
      interface: '📋',
      type: '📝',
      class: '📦',
      variable: '📄'
    };
    return icons[entity.type] || '•';
  }

  // ============================================================
  // ИНИЦИАЛИЗАЦИЯ VIS-NETWORK
  // ============================================================
  let network;
  let nodesDS;
  let edgesDS;
  let selectedId = null;
  let allEntities = [];
  let allEdges = [];

  function initNetwork(container, nodes, edges, options) {
    if (network) {
      network.destroy();
      network = null;
    }

    nodesDS = new vis.DataSet(nodes);
    edgesDS = new vis.DataSet(edges);

    network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, options);

    network.on('click', (params) => {
      if (params.nodes.length > 0) {
        showDetails(params.nodes[0]);
      }
    });

    network.on('doubleClick', (params) => {
      if (params.nodes.length > 0) {
        focusNeighborhood(params.nodes[0]);
      }
    });

    network.on('hoverNode', (params) => {
      // Можно добавить подсветку
    });

    network.on('blurNode', (params) => {
      // Можно убрать подсветку
    });

    return network;
  }

  function renderGraph(filters) {
    const container = document.getElementById('graph');

    if (!allEntities.length || !allEdges.length) {
      container.innerHTML = '<div class="loading">Нет данных</div>';
      return;
    }

    const { nodes, edges, entityData } = buildGraph(allEntities, allEdges, filters);

    if (nodes.length === 0) {
      container.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);flex-direction:column;gap:8px;">
            <div style="font-size:32px;">🔍</div>
            <div>Ничего не найдено</div>
          </div>
        `;
      return;
    }

    const isHierarchical = document.getElementById('layout').value === 'hierarchical';

    const options = {
      nodes: {
        borderWidth: 2,
        scaling: {
          min: 8,
          max: 40,
          label: { min: 8, max: 14 }
        },
        font: {
          size: 11,
          color: '#e8eefc',
          face: 'Inter, system-ui, sans-serif'
        },
        shadow: {
          enabled: true,
          color: 'rgba(0,0,0,0.3)',
          size: 4
        }
      },
      edges: {
        width: 1.2,
        selectionWidth: 2.5,
        smooth: {
          type: 'dynamic',
          roundness: 0.3
        },
        font: {
          size: 8,
          color: '#64748b',
          align: 'middle'
        }
      },
      physics: isHierarchical ? false : {
        enabled: true,
        solver: 'forceAtlas2Based',
        forceAtlas2Based: {
          gravitationalConstant: -50,
          springLength: 120,
          springConstant: 0.05,
          damping: 0.9
        },
        stabilization: {
          iterations: 150,
          updateInterval: 25
        },
        maxVelocity: 50,
        minVelocity: 0.1
      },
      layout: isHierarchical ? {
        hierarchical: {
          enabled: true,
          direction: 'UD',
          sortMethod: 'directed',
          nodeSpacing: 150,
          levelSeparation: 120,
          treeSpacing: 200,
          blockShifting: true,
          edgeMinimization: true,
          parentCentralization: true
        }
      } : { hierarchical: false },
      interaction: {
        hover: true,
        tooltipDelay: 100,
        multiselect: false,
        navigationButtons: true,
        keyboard: true,
        dragNodes: true,
        dragView: true,
        zoomView: true
      }
    };

    // Сохраняем текущий зум
    let currentScale = 1;
    let currentPosition = { x: 0, y: 0 };
    if (network) {
      const scale = network.getScale();
      const pos = network.getViewPosition();
      if (scale) currentScale = scale;
      if (pos) currentPosition = pos;
    }

    // Создаем новый network
    container.innerHTML = '';
    network = initNetwork(container, nodes, edges, options);

    // Восстанавливаем позицию
    if (currentScale > 0 && currentPosition) {
      try {
        network.moveTo({
          position: currentPosition,
          scale: Math.min(currentScale, 1.5),
          animation: false
        });
      } catch (e) {
        // Игнорируем ошибки
      }
    }

    // Обновляем счетчики в статистике
    updateStats(entityData);
  }

  // ============================================================
  // ОТОБРАЖЕНИЕ ДЕТАЛЕЙ
  // ============================================================
  function showDetails(id) {
    selectedId = id;
    const entity = allEntities.find(e => e.id === id);
    if (!entity) {
      document.getElementById('details').innerHTML = '<p class="empty">Сущность не найдена</p>';
      return;
    }

    const detailsDiv = document.getElementById('details');

    let html = `<h2>${getEntityIcon(entity)} ${entity.name}</h2>`;
    html += `<div class="meta">`;
    html += `<span class="entity-badge badge-${entity.type}">${ENTITY_LABELS[entity.type] || entity.type}</span>`;
    if (entity.isExported) html += ' 📤 Экспортирована';
    if (entity.isAsync) html += ' ⚡ Асинхронная';
    if (entity.isEntry) html += ' ⭐ Точка входа';
    html += `</div>`;

    // Общая информация
    html += `<div style="font-size:12px;color:var(--muted);margin-bottom:8px;">`;
    if (entity.module) {
      const moduleLink = `<a data-id="${entity.module}">${basename(entity.module)}</a>`;
      html += `Модуль: ${moduleLink}`;
    }
    if (entity.line) html += ` | Строка: ${entity.line}`;
    if (entity.language) html += ` | Язык: ${entity.language}`;
    if (entity.fileStats) {
      if (entity.fileStats.lines) html += ` | Строк: ${entity.fileStats.lines}`;
      if (entity.fileStats.size) html += ` | Размер: ${formatFileSize(entity.fileStats.size)}`;
    }
    html += `</div>`;

    // Информация по типу
    if (entity.type === 'function') {
      html += `<div style="font-size:12px;margin-bottom:6px;">`;
      html += `<b>Сигнатура:</b> ${entity.name}(${(entity.params || []).join(', ')})`;
      if (entity.returnType) html += `: ${entity.returnType}`;
      html += `</div>`;
      if (entity.complexity) {
        const color = entity.complexity > 10 ? '#f87171' : entity.complexity > 5 ? '#fbbf24' : '#4ade80';
        html += `<div style="font-size:12px;color:${color};">🔄 Сложность: ${entity.complexity}</div>`;
      }
      if (entity.body) {
        html += `<details style="margin:4px 0;"><summary style="cursor:pointer;color:var(--accent);font-size:12px;">📄 Тело функции</summary>`;
        html += `<pre style="background:#0a0a1a;padding:8px;border-radius:4px;font-size:11px;overflow:auto;max-height:150px;color:#e2e8f0;border:1px solid var(--border);">${escapeHtml(entity.body)}</pre>`;
        html += `</details>`;
      }
    }

    if (entity.type === 'class') {
      if (entity.extends) html += `<div style="font-size:12px;">📤 Наследует: ${entity.extends}</div>`;
      if (entity.implements?.length) {
        html += `<div style="font-size:12px;">📋 Реализует: ${entity.implements.join(', ')}</div>`;
      }
      if (entity.properties?.length) {
        html += `<div style="font-size:12px;">📌 Свойства: ${entity.properties.length}</div>`;
      }
      if (entity.methods?.length) {
        html += `<div style="font-size:12px;">ƒ Методы: ${entity.methods.length}</div>`;
      }
    }

    if (entity.type === 'interface' || entity.type === 'type') {
      if (entity.extends?.length) {
        html += `<div style="font-size:12px;">📤 Расширяет: ${entity.extends.join(', ')}</div>`;
      }
      if (entity.properties?.length) {
        html += `<div style="font-size:12px;">📌 Свойства: ${entity.properties.length}</div>`;
      }
      if (entity.definition) {
        html += `<details style="margin:4px 0;"><summary style="cursor:pointer;color:var(--accent);font-size:12px;">📄 Определение</summary>`;
        html += `<pre style="background:#0a0a1a;padding:8px;border-radius:4px;font-size:11px;overflow:auto;max-height:150px;color:#e2e8f0;border:1px solid var(--border);">${escapeHtml(entity.definition)}</pre>`;
        html += `</details>`;
      }
    }

    if (entity.type === 'constant' || entity.type === 'variable') {
      if (entity.value) {
        html += `<div style="font-size:12px;">📌 Значение: <code style="background:#0a0a1a;padding:2px 6px;border-radius:4px;font-size:11px;">${escapeHtml(String(entity.value))}</code></div>`;
      }
    }

    // Связи
    const incoming = allEdges.filter(e => e.to === entity.id);
    const outgoing = allEdges.filter(e => e.from === entity.id);

    if (incoming.length || outgoing.length) {
      html += `<div style="margin-top:8px;border-top:1px solid var(--border);padding-top:8px;">`;

      if (outgoing.length) {
        html += `<div style="font-size:12px;color:var(--muted);margin-bottom:4px;">📤 Исходящие связи (${outgoing.length}):</div>`;
        html += `<ul class="list">`;
        for (const edge of outgoing) {
          const target = allEntities.find(e => e.id === edge.to);
          if (target) {
            html += `<li><a data-id="${edge.to}">${getEntityIcon(target)} ${target.name}</a> <span style="color:#64748b;font-size:10px;">(${edge.type})</span></li>`;
          }
        }
        html += `</ul>`;
      }

      if (incoming.length) {
        html += `<div style="font-size:12px;color:var(--muted);margin-bottom:4px;">📥 Входящие связи (${incoming.length}):</div>`;
        html += `<ul class="list">`;
        for (const edge of incoming) {
          const source = allEntities.find(e => e.id === edge.from);
          if (source) {
            html += `<li><a data-id="${edge.from}">${getEntityIcon(source)} ${source.name}</a> <span style="color:#64748b;font-size:10px;">(${edge.type})</span></li>`;
          }
        }
        html += `</ul>`;
      }

      html += `</div>`;
    }

    // Экспорты для модуля
    if (entity.type === 'module' && entity.exports) {
      const exportNames = Object.keys(entity.exports);
      if (exportNames.length) {
        html += `<div style="margin-top:8px;border-top:1px solid var(--border);padding-top:8px;">`;
        html += `<div style="font-size:12px;color:var(--muted);margin-bottom:4px;">📤 Экспорты (${exportNames.length}):</div>`;
        html += `<div style="display:flex;flex-wrap:wrap;gap:4px;">`;
        for (const name of exportNames) {
          html += `<span style="font-size:10px;background:#0f172a;padding:1px 8px;border-radius:4px;border:1px solid var(--border);">${escapeHtml(name)}</span>`;
        }
        html += `</div></div>`;
      }
    }

    // Вызовы для функции
    if (entity.type === 'function') {
      if (entity.calls?.length) {
        html += `<div style="margin-top:8px;border-top:1px solid var(--border);padding-top:8px;">`;
        html += `<div style="font-size:12px;color:var(--muted);margin-bottom:4px;">📞 Вызывает (${entity.calls.length}):</div>`;
        html += `<div style="display:flex;flex-wrap:wrap;gap:4px;">`;
        for (const call of entity.calls) {
          const target = allEntities.find(e => e.type === 'function' && e.name === call);
          if (target) {
            html += `<a data-id="${target.id}" style="font-size:10px;background:#0f172a;padding:1px 8px;border-radius:4px;border:1px solid var(--border);color:var(--accent);cursor:pointer;text-decoration:none;">${escapeHtml(call)}</a>`;
          } else {
            html += `<span style="font-size:10px;background:#0f172a;padding:1px 8px;border-radius:4px;border:1px solid var(--border);color:#64748b;">${escapeHtml(call)}</span>`;
          }
        }
        html += `</div></div>`;
      }

      if (entity.calledBy?.length) {
        html += `<div style="margin-top:8px;border-top:1px solid var(--border);padding-top:8px;">`;
        html += `<div style="font-size:12px;color:var(--muted);margin-bottom:4px;">📥 Кем вызвана (${entity.calledBy.length}):</div>`;
        html += `<div style="display:flex;flex-wrap:wrap;gap:4px;">`;
        for (const caller of entity.calledBy) {
          const source = allEntities.find(e => e.type === 'function' && e.name === caller);
          if (source) {
            html += `<a data-id="${source.id}" style="font-size:10px;background:#0f172a;padding:1px 8px;border-radius:4px;border:1px solid var(--border);color:var(--accent);cursor:pointer;text-decoration:none;">${escapeHtml(caller)}</a>`;
          } else {
            html += `<span style="font-size:10px;background:#0f172a;padding:1px 8px;border-radius:4px;border:1px solid var(--border);color:#64748b;">${escapeHtml(caller)}</span>`;
          }
        }
        html += `</div></div>`;
      }
    }

    detailsDiv.innerHTML = html;

    // Обработчики для ссылок
    detailsDiv.querySelectorAll('a[data-id]').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        const targetId = a.getAttribute('data-id');
        const target = allEntities.find(e => e.id === targetId);
        if (target) {
          network.selectNodes([targetId]);
          network.focus(targetId, { scale: 1.15, animation: { duration: 300 } });
          showDetails(targetId);
        }
      });
    });
  }

  function focusNeighborhood(id) {
    const entity = allEntities.find(e => e.id === id);
    if (!entity) return;

    const keep = new Set([id]);
    // Добавляем связанные узлы
    for (const edge of allEdges) {
      if (edge.from === id) keep.add(edge.to);
      if (edge.to === id) keep.add(edge.from);
    }

    // Скрываем все узлы, кроме выбранных
    const allNodeIds = new Set(allEntities.map(e => e.id));
    for (const nodeId of allNodeIds) {
      const hidden = !keep.has(nodeId);
      nodesDS.update({ id: nodeId, hidden: hidden });
    }

    network.focus(id, { scale: 1.2, animation: { duration: 400 } });
    showDetails(id);
  }

  // ============================================================
  // СТАТИСТИКА
  // ============================================================
  function updateStats(entityData) {
    const stats = document.getElementById('stats');
    if (!stats) return;

    const total = entityData.length;
    const modules = entityData.filter(e => e.type === 'module').length;
    const functions = entityData.filter(e => e.type === 'function').length;
    const classes = entityData.filter(e => e.type === 'class').length;
    const interfaces = entityData.filter(e => e.type === 'interface').length;
    const types = entityData.filter(e => e.type === 'type').length;
    const constants = entityData.filter(e => e.type === 'constant').length;
    const variables = entityData.filter(e => e.type === 'variable').length;
    const exported = entityData.filter(e => e.isExported).length;

    stats.innerHTML = [
      ['📊 Всего', total],
      ['📁 Модулей', modules],
      ['ƒ Функций', functions],
      ['📦 Классов', classes],
      ['📋 Интерфейсов', interfaces],
      ['📝 Типов', types],
      ['📌 Констант', constants],
      ['📄 Переменных', variables],
      ['📤 Экспортов', exported],
    ].map(([label, value]) =>
      `<div class="stat"><b>${value}</b><span>${label}</span></div>`
    ).join('');
  }

  // ============================================================
  // УТИЛИТЫ
  // ============================================================
  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  // ============================================================
  // ОСНОВНАЯ ФУНКЦИЯ ЗАПУСКА
  // ============================================================
  async function main() {
    const data = await loadData();
    if (!data) return;

    // Извлекаем все сущности
    allEntities = extractAllEntities(data);
    allEdges = buildEntityEdges(allEntities, data);

    console.log(`📊 Загружено сущностей: ${allEntities.length}`);
    console.log(`🔗 Загружено связей: ${allEdges.length}`);

    // Обновляем заголовок
    document.getElementById('headerInfo').textContent =
      `📊 ${allEntities.length} сущностей, ${allEdges.length} связей | ` +
      `Сгенерировано: ${data.timestamp || 'неизвестно'}`;

    // Настраиваем фильтры
    const groups = new Set();
    for (const e of allEntities) {
      groups.add(detectGroup(e));
    }
    const groupFilter = document.getElementById('groupFilter');
    for (const g of groups) {
      const opt = document.createElement('option');
      opt.value = g;
      opt.textContent = GROUP_LABELS[g] || g;
      groupFilter.appendChild(opt);
    }

    // Легенда
    const legend = document.getElementById('legend');
    legend.innerHTML = '';
    const typeGroups = ['module', 'function', 'constant', 'interface', 'type', 'class', 'variable'];
    for (const type of typeGroups) {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML =
        `<span class="dot" style="background:${ENTITY_COLORS[type]}"></span>` +
        `${ENTITY_LABELS[type]}`;
      legend.appendChild(chip);
    }

    // Рендерим граф
    renderGraph({
      search: '',
      group: '',
      entityType: '',
      showExternals: true
    });

    // Настройка обработчиков
    let searchTimeout;
    document.getElementById('search').addEventListener('input', () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        renderGraph({
          search: document.getElementById('search').value,
          group: document.getElementById('groupFilter').value,
          entityType: document.getElementById('entityTypeFilter').value,
          showExternals: document.getElementById('showExternals').checked
        });
      }, 300);
    });

    document.getElementById('groupFilter').addEventListener('change', () => {
      renderGraph({
        search: document.getElementById('search').value,
        group: document.getElementById('groupFilter').value,
        entityType: document.getElementById('entityTypeFilter').value,
        showExternals: document.getElementById('showExternals').checked
      });
    });

    document.getElementById('entityTypeFilter').addEventListener('change', () => {
      renderGraph({
        search: document.getElementById('search').value,
        group: document.getElementById('groupFilter').value,
        entityType: document.getElementById('entityTypeFilter').value,
        showExternals: document.getElementById('showExternals').checked
      });
    });

    document.getElementById('showExternals').addEventListener('change', () => {
      renderGraph({
        search: document.getElementById('search').value,
        group: document.getElementById('groupFilter').value,
        entityType: document.getElementById('entityTypeFilter').value,
        showExternals: document.getElementById('showExternals').checked
      });
    });

    document.getElementById('layout').addEventListener('change', () => {
      renderGraph({
        search: document.getElementById('search').value,
        group: document.getElementById('groupFilter').value,
        entityType: document.getElementById('entityTypeFilter').value,
        showExternals: document.getElementById('showExternals').checked
      });
    });

    document.getElementById('fit').addEventListener('click', () => {
      if (network) network.fit({ animation: { duration: 500 } });
    });

    document.getElementById('reset').addEventListener('click', () => {
      document.getElementById('search').value = '';
      document.getElementById('groupFilter').value = '';
      document.getElementById('entityTypeFilter').value = '';
      document.getElementById('showExternals').checked = true;
      document.getElementById('layout').value = 'physics';
      renderGraph({
        search: '',
        group: '',
        entityType: '',
        showExternals: true
      });
      if (network) network.fit({ animation: { duration: 500 } });
    });

    // Клавиатурные сокращения
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.getElementById('search').value = '';
        renderGraph({
          search: '',
          group: document.getElementById('groupFilter').value,
          entityType: document.getElementById('entityTypeFilter').value,
          showExternals: document.getElementById('showExternals').checked
        });
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
        e.preventDefault();
        document.getElementById('search').focus();
      }
    });

    console.log('✅ Приложение готово!');
    console.log('📌 Используйте поиск (Ctrl+F) для навигации');
    console.log('📌 Двойной клик по узлу — фокус на связанные');
  }

  // Запуск
  main().catch(console.error);
</script>
</body>
</html>
