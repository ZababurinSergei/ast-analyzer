<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 AST Analyzer — Граф-инспектор v9</title>
    <style>
        :root {
            --bg: #0d1117; --bg2: #161b22; --bg3: #21262d; --bg4: #30363d;
            --border: #30363d; --text: #e6edf3; --text2: #8b949e;
            --accent: #58a6ff; --green: #3fb950; --yellow: #d29922;
            --red: #f85149; --purple: #bc8cff; --cyan: #39d353; --orange: #f0883e;
            --r: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg); color: var(--text); height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .hdr {
            background: var(--bg2); border-bottom: 1px solid var(--border);
            padding: 8px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0;
        }
        .hdr h1 { font-size: 15px; }
        .hdr .v { background: var(--accent); color: #000; padding: 1px 7px; border-radius: 9px; font-size: 10px; font-weight: 700; }
        .hdr .sm { margin-left: auto; font-size: 11px; color: var(--text2); display: flex; gap: 8px; flex-wrap: wrap; }
        .hdr .sm b { color: var(--accent); }
        .hdr button {
            padding: 4px 10px; background: var(--bg3); border: 1px solid var(--border);
            border-radius: 6px; color: var(--text); font-size: 11px; cursor: pointer; font-family: inherit;
        }
        .hdr button:hover { border-color: var(--accent); }
        .lay { display: flex; flex: 1; overflow: hidden; }
        .sb {
            width: 320px; min-width: 320px; background: var(--bg2);
            border-right: 1px solid var(--border); display: flex; flex-direction: column;
        }
        .sb-h { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .sb-s { padding: 6px 10px; border-bottom: 1px solid var(--border); }
        .sb-s input {
            width: 100%; padding: 5px 8px; background: var(--bg3);
            border: 1px solid var(--border); border-radius: 5px;
            color: var(--text); font-size: 11px; outline: none; font-family: inherit;
        }
        .sb-t { flex: 1; overflow-y: auto; padding: 6px; font-size: 11px; }
        .tm { margin-bottom: 2px; }
        .tm-h {
            padding: 3px 6px; border-radius: 4px; cursor: pointer;
            display: flex; align-items: center; gap: 5px; font-weight: 600;
        }
        .tm-h:hover { background: var(--bg3); }
        .tm-h .a { font-size: 9px; transition: transform 0.15s; }
        .tm-h .a.o { transform: rotate(90deg); }
        .tf-l { padding-left: 10px; display: none; }
        .tf-l.o { display: block; }
        .tf {
            padding: 2px 6px; border-radius: 3px; cursor: pointer;
            display: flex; align-items: center; gap: 4px; color: var(--text2);
            font-family: monospace;
        }
        .tf:hover { background: var(--bg3); color: var(--text); }
        .tf .a { font-size: 8px; transition: transform 0.15s; }
        .tf .a.o { transform: rotate(90deg); }
        .fn-l { padding-left: 14px; display: none; }
        .fn-l.o { display: block; }
        .fn {
            padding: 2px 6px; border-radius: 3px; cursor: pointer;
            font-family: monospace; font-size: 10px; color: var(--text2);
            display: flex; align-items: center; gap: 4px;
        }
        .fn:hover { background: var(--bg3); color: var(--text); }
        .fn.act { background: rgba(63,185,80,0.12); color: var(--green); font-weight: 700; }
        .mn { flex: 1; overflow-y: auto; padding: 16px; }

        .ctx { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; font-size: 11px; }
        .ctx .c { padding: 3px 10px; background: var(--bg3); border: 1px solid var(--border); border-radius: 14px; cursor: pointer; }
        .ctx .c:hover { border-color: var(--accent); }
        .ctx .ar { color: var(--text2); }

        .n-card {
            display: inline-block; background: var(--bg2);
            border: 2px solid var(--accent); border-radius: 10px;
            padding: 14px 24px; box-shadow: 0 0 16px rgba(88,166,255,0.15);
            text-align: center; margin-bottom: 16px;
        }
        .n-card .nm { font-size: 18px; font-weight: 700; font-family: monospace; }
        .n-card .mt { font-size: 11px; color: var(--text2); margin-top: 4px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .n-card .bd { margin-top: 6px; display: flex; gap: 3px; justify-content: center; flex-wrap: wrap; }
        .b { display: inline-block; padding: 1px 7px; border-radius: 8px; font-size: 9px; font-weight: 600; }
        .b.e { background: rgba(63,185,80,0.2); color: var(--green); }
        .b.a { background: rgba(188,140,255,0.2); color: var(--purple); }
        .b.m { background: rgba(210,153,34,0.2); color: var(--yellow); }
        .b.r { background: rgba(88,166,255,0.2); color: var(--accent); }

        .eg { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 900px) { .eg { grid-template-columns: 1fr; } }
        .es { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
        .es-h { padding: 8px 12px; background: var(--bg3); border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .es-h .ct { background: var(--bg4); padding: 1px 7px; border-radius: 8px; font-size: 10px; }
        .es-b { padding: 8px; max-height: 360px; overflow-y: auto; }
        .ei {
            padding: 5px 8px; border-radius: 5px; margin-bottom: 3px;
            cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 11px;
        }
        .ei:hover { background: var(--bg3); }
        .ei .d { font-weight: bold; font-size: 13px; flex-shrink: 0; }
        .ei .n { font-family: monospace; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ei .inf { color: var(--text2); font-size: 10px; white-space: nowrap; margin-left: auto; }

        .imp-group { margin-bottom: 6px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
        .imp-group-h { padding: 5px 8px; background: var(--bg4); font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .imp-group-h .pkg { font-family: monospace; color: var(--accent); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .imp-group-h .badge { font-size: 9px; padding: 1px 5px; border-radius: 6px; background: var(--bg3); color: var(--text2); }
        .imp-group-b { padding: 4px 8px; background: var(--bg2); }
        .imp-row { display: flex; align-items: center; gap: 6px; padding: 3px 4px; font-size: 10px; font-family: monospace; border-radius: 4px; }
        .imp-row:hover { background: var(--bg3); }
        .imp-row .arrow { color: var(--accent); font-size: 11px; }
        .imp-row .from { color: var(--purple); }
        .imp-row .to { color: var(--green); }
        .imp-row .typ { font-size: 8px; padding: 1px 4px; border-radius: 4px; margin-left: auto; flex-shrink: 0; }
        .imp-row .typ.def { background: rgba(188,140,255,0.15); color: var(--purple); }
        .imp-row .typ.nmd { background: rgba(88,166,255,0.15); color: var(--accent); }
        .imp-row .typ.nsp { background: rgba(240,136,62,0.15); color: var(--orange); }
        .imp-row .typ.typ { background: rgba(210,153,34,0.15); color: var(--yellow); }
        .imp-empty { color: var(--text2); font-size: 10px; padding: 6px 8px; }
        .eh { text-align: center; padding: 50px; color: var(--text2); }
        .eh .ic { font-size: 40px; margin-bottom: 10px; }
        .drop {
            border: 2px dashed var(--border); border-radius: 12px;
            padding: 40px; text-align: center; margin: 20px; cursor: pointer;
        }
        .drop:hover { border-color: var(--accent); }

        .graph-wrap { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; overflow: auto; margin-bottom: 12px; }
        .graph-svg { width: 100%; height: auto; display: block; min-height: 260px; }
        .graph-node-rect { fill: var(--bg2); stroke: var(--border); stroke-width: 1.5; }
        .graph-node.center .graph-node-rect { fill: rgba(88,166,255,0.1); stroke: var(--accent); stroke-width: 2; }
        .graph-node.caller .graph-node-rect { fill: rgba(188,140,255,0.1); stroke: var(--purple); }
        .graph-node.callee .graph-node-rect { fill: rgba(88,166,255,0.1); stroke: var(--accent); }
        .graph-node.external .graph-node-rect { fill: rgba(248,81,73,0.1); stroke: var(--red); }
        .graph-node.module-rect { fill: rgba(63,185,80,0.1); stroke: var(--green); }
        .graph-node-label { font-family: monospace; font-size: 12px; font-weight: 700; fill: var(--text); }
        .graph-node-sub { font-family: monospace; font-size: 10px; fill: var(--text2); }
        .graph-node-icon { font-size: 13px; fill: var(--text); }
        .graph-edge { fill: none; stroke-width: 1.5; opacity: 0.7; }
        .graph-edge.edge-in { stroke: var(--purple); }
        .graph-edge.edge-out { stroke: var(--accent); }
        .graph-edge.edge-ext { stroke: var(--red); }
        .graph-edge-label { font-family: monospace; font-size: 9px; fill: var(--text2); }
        .graph-empty-text { font-family: monospace; font-size: 11px; fill: var(--text2); }
        .minimap-edge { stroke: var(--accent); }
        .minimap-node .graph-node-rect { fill: rgba(63,185,80,0.08); stroke: var(--green); }

        .heatmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px; }
        .heat-cell { padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 6px; border: 1px solid transparent; font-family: monospace; font-size: 11px; }
        .heat-cell:hover { border-color: var(--accent); }
        .heat-cell-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .heat-cell-count { font-weight: 700; }

        .graph-chain { margin-bottom: 12px; }
        .chain { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 10px 14px; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; font-size: 12px; }
        .chain-node { padding: 3px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; font-family: monospace; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
        .chain-node:hover { border-color: var(--accent); color: var(--accent); }
        .chain-node.current { background: var(--accent); color: #fff; border-color: var(--accent); }
        .chain-arrow { color: var(--text2); font-weight: 700; }

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--bg3); color: var(--text); padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px; transition: transform 0.3s; z-index: 9999; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { border-color: var(--red); color: var(--red); }
        .toast.success { border-color: var(--green); color: var(--green); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }
    </style>
</head>
<body>
<div class="hdr">
    <h1>🔍 AST Analyzer</h1><span class="v">v9 граф-инспектор</span>
    <div class="sm" id="sm"></div>
    <button id="btnOpen">📂 Открыть JSON</button>
    <input type="file" id="fi" accept=".json" style="display:none">
</div>

<div id="dropZone" class="drop">
    <div style="font-size:40px;margin-bottom:10px">📦</div>
    <strong>Перетащите index.full.json.json или нажмите для выбора</strong>
    <div style="font-size:11px;color:var(--text2);margin-top:6px">Формат ast-analyzer v8.0.0 · модульная версия v9</div>
</div>

<div id="app" class="lay" style="display:none">
    <div class="sb">
        <div class="sb-h">📂 Навигация по графу</div>
        <div class="sb-s"><input id="si" placeholder="Поиск функции или файла..."></div>
        <div class="sb-t" id="st"></div>
    </div>
    <div class="mn" id="mn">
        <div class="eh"><div class="ic">🎯</div><p>Выберите функцию или файл из дерева</p></div>
    </div>
</div>

<script type="module">
  import * as Core from './ast-analyzer-core.js';
  import * as UI from './ast-analyzer-ui.js';
  import * as Graph from './ast-analyzer-graph.js';

  const $ = id => document.getElementById(id);
  const state = Core.state;

  let activeFnId = null;
  let activeFileId = null;

  // ---------------------------------------------------------------------------
  // ЗАГРУЗКА
  // ---------------------------------------------------------------------------
  $('btnOpen').addEventListener('click', () => $('fi').click());
  $('dropZone').addEventListener('click', () => $('fi').click());
  $('fi').addEventListener('change', e => handleFile(e.target.files[0]));

  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    e.preventDefault();
    const f = e.dataTransfer.files[0];
    if (f && f.name.endsWith('.json')) handleFile(f);
  });

  function handleFile(file) {
    if (!file) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        Core.loadData(JSON.parse(ev.target.result));
        init();
      } catch (err) {
        UI.toast('Ошибка: ' + err.message, 'error');
      }
    };
    r.readAsText(file);
  }

  // ---------------------------------------------------------------------------
  // ИНИЦИАЛИЗАЦИЯ
  // ---------------------------------------------------------------------------
  function init() {
    $('dropZone').style.display = 'none';
    $('app').style.display = 'flex';
    const s = Core.getProjectStats();
    $('sm').innerHTML = `
    <span>📦<b>${s.totalModules}</b></span>
    <span>📄<b>${s.totalFiles}</b></span>
    <span>ƒ<b>${s.totalFunctions}</b></span>
    <span>📞<b>${s.totalCalls}</b></span>
    <span>🔗<b>${s.totalImports}</b></span>
    <span>📤<b>${s.totalExports}</b></span>
    <span>💀<b>${s.deadExports + s.deadFunctions}</b></span>
    <span>🔄<b>${s.cyclicDeps}</b></span>
  `;
    renderTree();
    if (state.functions && Object.keys(state.functions).length) {
      const firstFn = Object.values(state.functions)[0];
      selectFn(firstFn.id);
    }
  }

  // ---------------------------------------------------------------------------
  // ДЕРЕВО
  // ---------------------------------------------------------------------------
  function renderTree() {
    const h = [];
    for (const m of Object.values(state.modules)) {
      const fs = state.moduleFiles[m.id] || [];
      h.push(`<div class="tm">
      <div class="tm-h" data-action="toggle-tm">
        <span class="a">▶</span>📦${Core.escapeHtml(m.name)}
        <span style="color:var(--text2);font-size:9px;margin-left:auto">${fs.length}</span>
      </div>
      <div class="tf-l">`);
      for (const fid of fs) {
        const f = state.files[fid];
        if (!f) continue;
        const fns = state.fileFunctions[fid] || [];
        if (fns.length > 0) {
          h.push(`<div class="tf" data-action="toggle-tf">
          <span class="a">▶</span>📄${Core.escapeHtml(f.path.split('/').pop())}
          <span style="font-size:9px;color:var(--text2)">(${fns.length})</span>
        </div>
        <div class="fn-l">`);
          fns.sort((a, b) => (a.line || 0) - (b.line || 0));
          for (const fn of fns) {
            h.push(`<div class="fn" id="x-${fn.id}" data-action="select-fn" data-id="${fn.id}">
            ƒ ${Core.escapeHtml(fn.name)}
            <span style="font-size:8px;color:var(--text2)">L${fn.line || 0}</span>
          </div>`);
          }
          h.push(`</div>`);
        } else {
          h.push(`<div class="tf" data-action="select-file" data-id="${fid}">📄${Core.escapeHtml(f.path.split('/').pop())}</div>`);
        }
      }
      h.push(`</div></div>`);
    }
    $('st').innerHTML = h.join('');

    // Поиск
    $('si').addEventListener('input', function() {
      const q = this.value.toLowerCase();
      const all = document.querySelectorAll('.fn, .tf');
      for (const el of all) {
        el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';
      }
      if (q) {
        document.querySelectorAll('.tf-l, .fn-l').forEach(el => el.classList.add('o'));
        document.querySelectorAll('.a').forEach(el => el.classList.add('o'));
      }
    });
  }

  // ---------------------------------------------------------------------------
  // ВЫБОР ФУНКЦИИ
  // ---------------------------------------------------------------------------
  function selectFn(id) {
    activeFnId = id;
    activeFileId = null;
    document.querySelectorAll('.fn').forEach(el => el.classList.remove('act'));
    const el = $('x-' + id);
    if (el) {
      el.classList.add('act');
      el.scrollIntoView({ block: 'nearest' });
      let p = el.parentElement;
      while (p) {
        if (p.classList.contains('fn-l') || p.classList.contains('tf-l')) {
          p.classList.add('o');
          const prev = p.previousElementSibling;
          if (prev) {
            const a = prev.querySelector('.a');
            if (a) a.classList.add('o');
          }
        }
        p = p.parentElement;
      }
    }
    renderFn(id);
  }

  function selectFile(fid) {
    activeFnId = null;
    activeFileId = fid;
    renderFile(fid);
  }

  // ---------------------------------------------------------------------------
  // РЕНДЕР ФУНКЦИИ
  // ---------------------------------------------------------------------------
  function renderFn(id) {
    const fn = state.fnById[id];
    if (!fn) return;
    const info = Core.getFnFullInfo(id);
    const file = info.file;
    const mod = info.module;

    const callers = info.callers;
    const callees = info.calls;
    const fImps = file ? (state.fileImports[file.id] || []) : [];
    const fImporters = file ? (state.fileDependents[file.id] || []) : [];
    const exps = info.exports;
    const sibs = file ? (state.fileFunctions[file.id] || []).filter(f => f.id !== id) : [];

    const bds = [];
    if (fn.isExported) bds.push('<span class="b e">export</span>');
    if (fn.isAsync) bds.push('<span class="b a">async</span>');
    if (fn.isMethod) bds.push('<span class="b m">method</span>');
    if (fn.isArrow) bds.push('<span class="b r">arrow</span>');

    const h = [];
    h.push(`<div class="ctx">
    <span class="c">📦 ${Core.escapeHtml(mod?.name || '?')}</span>
    <span class="ar">→</span>
    <span class="c" data-action="select-file" data-id="${file?.id || ''}">📄 ${Core.escapeHtml(Core.shortPath(file?.path || '?', 60))}</span>
    ${exps.length ? `<span class="ar">→</span><span class="c" style="border-color:var(--green);color:var(--green)">📤 ${Core.escapeHtml(exps[0].exportName)}</span>` : ''}
  </div>`);

    h.push(`<div style="text-align:center"><div class="n-card">
    <div class="nm">ƒ ${Core.escapeHtml(fn.name)}</div>
    <div class="mt">
      <span>📍 L${fn.line || 0}</span>
      ${fn.params?.length ? `<span>(${Core.escapeHtml(fn.params.join(', '))})</span>` : ''}
      ${fn.returnType ? `<span>→ ${Core.escapeHtml(Core.formatType(fn.returnType))}</span>` : ''}
    </div>
    <div class="bd">${bds.join('')}</div>
  </div></div>`);

    // Цепочка вызовов (линейная)
    const chainEl = Graph.renderCallChain(id, { direction: 'both', depth: 3 });
    h.push(`<div class="es" style="margin-bottom:12px;">
    <div class="es-h">🔗 Цепочка вызовов</div>
    <div class="es-b" id="callChainBody"></div>
  </div>`);

    // Граф вызовов
    h.push(`<div class="es" style="margin-bottom:12px;">
    <div class="es-h">📞 Граф вызовов</div>
    <div class="es-b" id="callGraphBody"></div>
  </div>`);

    // Граф вызовов файла
    if (file) {
      h.push(`<div class="es" style="margin-bottom:12px;">
      <div class="es-h">🔗 Граф зависимостей файла</div>
      <div class="es-b" id="fileDepGraphBody"></div>
    </div>`);
    }

    h.push(`<div class="eg">`);

    // Входы
    h.push(`<div class="es"><div class="es-h">📥 Входы — кто вызывает <span class="ct">${callers.length}</span></div><div class="es-b">`);
    if (callers.length) {
      for (const c of callers) {
        h.push(`<div class="ei" data-action="select-fn" data-id="${c.fromFnId}">
        <span class="d" style="color:var(--green)">←</span>
        <span class="n">${Core.escapeHtml(c.fromFnName)}</span>
        <span class="inf">${Core.escapeHtml(c.callType)}·L${c.callLine}</span>
      </div>`);
      }
    } else h.push('<div class="imp-empty">Нет входящих вызовов</div>');
    h.push(`</div></div>`);

    // Выходы
    h.push(`<div class="es"><div class="es-h">📤 Выходы — что вызывает <span class="ct">${callees.length}</span></div><div class="es-b">`);
    if (callees.length) {
      for (const c of callees) {
        h.push(`<div class="ei" ${!c.isExternal ? `data-action="select-fn" data-id="${c.toFnId}"` : ''}>
        <span class="d" style="color:var(--red)">→</span>
        <span class="n">${c.isExternal ? '🌐 ' : ''}${Core.escapeHtml(c.toFnName)}</span>
        <span class="inf">${Core.escapeHtml(c.callType)}·L${c.callLine}${c.isExternal ? '·⚡' : ''}</span>
      </div>`);
      }
    } else h.push('<div class="imp-empty">Нет исходящих вызовов</div>');
    h.push(`</div></div>`);

    // Импорты файла
    h.push(`<div class="es"><div class="es-h">📦 Импорты файла <span class="ct">${fImps.length}</span></div><div class="es-b">${renderImportsBlock(fImps)}</div></div>`);

    // Импортируют файл
    h.push(`<div class="es"><div class="es-h">🔗 Импортируют файл <span class="ct">${fImporters.length}</span></div><div class="es-b">${renderImportersBlock(fImporters)}</div></div>`);

    // Соседи
    h.push(`<div class="es"><div class="es-h">👥 Соседи по файлу <span class="ct">${sibs.length}</span></div><div class="es-b">`);
    if (sibs.length) {
      for (const s of sibs.slice(0, 20)) {
        h.push(`<div class="ei" data-action="select-fn" data-id="${s.id}">
        <span class="d" style="color:var(--yellow)">ƒ</span>
        <span class="n">${Core.escapeHtml(s.name)}</span>
        <span class="inf">L${s.line || 0}${s.isExported ? '·exp' : ''}</span>
      </div>`);
      }
      if (sibs.length > 20) h.push(`<div class="imp-empty">…ещё ${sibs.length - 20}</div>`);
    } else h.push('<div class="imp-empty">Единственная функция в файле</div>');
    h.push(`</div></div>`);

    // Транзитивные
    const tCallers = Core.getTransitiveCallers(id, 3);
    const tCallees = Core.getTransitiveCallees(id, 3);
    if (tCallers.length > 1 || tCallees.length > 1) {
      h.push(`<div class="es" style="grid-column:1/-1;">
      <div class="es-h">🔮 Транзитивные связи (глубина 3)</div>
      <div class="es-b">
        <div style="font-size:10px;color:var(--text2);margin-bottom:6px;">Вызывающие (${tCallers.length}):</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;">
          ${tCallers.slice(0, 20).map(f => `<span class="ei" style="display:inline-flex;padding:2px 8px;background:var(--bg3);border-radius:10px;" data-action="select-fn" data-id="${f.id}">${Core.escapeHtml(f.name)}</span>`).join('')}
        </div>
        <div style="font-size:10px;color:var(--text2);margin-bottom:6px;">Вызываемые (${tCallees.length}):</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;">
          ${tCallees.slice(0, 20).map(f => `<span class="ei" style="display:inline-flex;padding:2px 8px;background:var(--bg3);border-radius:10px;" data-action="select-fn" data-id="${f.id}">${Core.escapeHtml(f.name)}</span>`).join('')}
        </div>
      </div>
    </div>`);
    }

    h.push(`</div>`);
    $('mn').innerHTML = h.join('');

    // Рисуем цепочку
    $('callChainBody').appendChild(chainEl);

    // Рисуем граф вызовов
    const callGraphEl = Graph.renderCallGraph(id, {
      onNodeClick: (nodeId, type) => { if (type === 'fn') selectFn(nodeId); },
    });
    $('callGraphBody').appendChild(callGraphEl);

    // Рисуем граф зависимостей файла
    if (file) {
      const fileDepEl = Graph.renderFileDepGraph(file.id, {
        onNodeClick: (nodeId) => selectFile(nodeId),
      });
      $('fileDepGraphBody').appendChild(fileDepEl);
    }
  }

  // ---------------------------------------------------------------------------
  // РЕНДЕР ФАЙЛА
  // ---------------------------------------------------------------------------
  function renderFile(fid) {
    const f = state.files[fid];
    if (!f) return;
    const mod = state.modules[f.moduleId];
    const fns = state.fileFunctions[fid] || [];
    const exps = state.fileExports[fid] || [];
    const imps = state.fileImports[fid] || [];
    const deps = [...new Set(state.fileDependents[fid] || [])];
    const depsOut = [...new Set(state.fileDependencies[fid] || [])];

    const h = [];
    h.push(`<div class="ctx">
    <span class="c">📦 ${Core.escapeHtml(mod?.name || '?')}</span>
    <span class="ar">→</span>
    <span class="c" style="border-color:var(--yellow);color:var(--yellow)">📄 ${Core.escapeHtml(f.path)}</span>
  </div>`);

    h.push(`<div style="text-align:center"><div class="n-card">
    <div class="nm">📄 ${Core.escapeHtml(f.path)}</div>
    <div class="mt">
      <span>Модуль: ${Core.escapeHtml(mod?.name || '?')}</span>
      <span>Функций: ${fns.length}</span>
      <span>Экспортов: ${exps.length}</span>
      <span>Импортов: ${imps.length}</span>
    </div>
  </div></div>`);

    // Граф модулей
    h.push(`<div class="es" style="margin-bottom:12px;">
    <div class="es-h">🗺️ Граф модулей</div>
    <div class="es-b" id="moduleGraphBody"></div>
  </div>`);

    // Граф зависимостей файла
    h.push(`<div class="es" style="margin-bottom:12px;">
    <div class="es-h">🔗 Граф зависимостей файла</div>
    <div class="es-b" id="fileDepGraphBody"></div>
  </div>`);

    h.push(`<div class="eg">`);

    // Прямые экспорты
    h.push(`<div class="es"><div class="es-h">📤 Прямые экспорты <span class="ct">${exps.length}</span></div><div class="es-b">`);
    if (exps.length) {
      for (const ex of exps) {
        const fn = ex.functionId ? state.fnById[ex.functionId] : null;
        h.push(`<div class="ei" ${fn ? `data-action="select-fn" data-id="${fn.id}"` : ''}>
        <span class="d" style="color:var(--green)">📤</span>
        <span class="n">${Core.escapeHtml(ex.exportName || '?')}</span>
        <span class="inf">${Core.escapeHtml(ex.type || 'named')}</span>
      </div>`);
      }
    } else h.push('<div class="imp-empty">Нет прямых экспортов</div>');
    h.push(`</div></div>`);

    // Импорты файла
    h.push(`<div class="es"><div class="es-h">📥 Импорты файла <span class="ct">${imps.length}</span></div><div class="es-b">${renderImportsBlock(imps)}</div></div>`);

    // Импортируют файл
    h.push(`<div class="es"><div class="es-h">🔗 Импортируют файл <span class="ct">${deps.length}</span></div><div class="es-b">${renderImportersBlock(deps.map(id => ({ fromFileId: id })))}</div></div>`);

    // Зависит от
    h.push(`<div class="es"><div class="es-h">📤 Импортирует из <span class="ct">${depsOut.length}</span></div><div class="es-b">`);
    if (depsOut.length) {
      for (const id of depsOut) {
        h.push(`<div class="ei" data-action="select-file" data-id="${id}">
        <span class="d" style="color:var(--accent)">→</span>
        <span class="n">${Core.escapeHtml(Core.getFilePath(id))}</span>
      </div>`);
      }
    } else h.push('<div class="imp-empty">Нет исходящих зависимостей</div>');
    h.push(`</div></div>`);

    // Функции
    h.push(`<div class="es"><div class="es-h">⚙️ Функции <span class="ct">${fns.length}</span></div><div class="es-b">`);
    if (fns.length) {
      for (const fn of fns) {
        h.push(`<div class="ei" data-action="select-fn" data-id="${fn.id}">
        <span class="d" style="color:var(--purple)">ƒ</span>
        <span class="n">${Core.escapeHtml(fn.name)}</span>
        <span class="inf">L${fn.line}${fn.isExported ? '·exp' : ''}</span>
      </div>`);
      }
    } else h.push('<div class="imp-empty">Нет функций</div>');
    h.push(`</div></div>`);

    h.push(`</div>`);
    $('mn').innerHTML = h.join('');

    // Граф модулей
    $('moduleGraphBody').appendChild(Graph.renderModuleGraph({
      onNodeClick: (id, type) => { if (type === 'module') selectFile(id); },
    }));

    // Граф зависимостей файла
    $('fileDepGraphBody').appendChild(Graph.renderFileDepGraph(fid, {
      onNodeClick: (id) => selectFile(id),
    }));
  }

  // ---------------------------------------------------------------------------
  // БЛОКИ ИМПОРТОВ
  // ---------------------------------------------------------------------------
  function getTypeClass(type) {
    if (type === 'default') return 'def';
    if (type === 'namespace') return 'nsp';
    if (type === 'type-only') return 'typ';
    return 'nmd';
  }

  function getTypeLabel(type) {
    if (type === 'default') return 'default';
    if (type === 'namespace') return 'namespace';
    if (type === 'type-only') return 'type';
    return 'named';
  }

  function renderImportsBlock(fileImports) {
    if (!fileImports.length) return '<div class="imp-empty">Нет импортов</div>';
    const ext = {}, int = {};
    for (const imp of fileImports) {
      if (imp.isExternal) {
        const k = imp.packageName || imp.source;
        if (!ext[k]) ext[k] = [];
        ext[k].push(imp);
      } else {
        if (!int[imp.source]) int[imp.source] = [];
        int[imp.source].push(imp);
      }
    }
    const h = [];

    for (const [pkg, imps] of Object.entries(ext)) {
      h.push(`<div class="imp-group">
      <div class="imp-group-h">
        <span style="color:var(--purple)">📦</span>
        <span class="pkg">${Core.escapeHtml(pkg)}</span>
        <span class="badge">${imps.length}</span>
      </div>
      <div class="imp-group-b">`);
      for (const im of imps) {
        const tc = getTypeClass(im.type);
        const tl = getTypeLabel(im.type);
        const showLocal = im.localName !== im.importedName;
        h.push(`<div class="imp-row">
        <span class="from">${Core.escapeHtml(im.importedName)}</span>
        ${showLocal ? `<span class="arrow">→</span><span class="to">${Core.escapeHtml(im.localName)}</span>` : ''}
        <span class="typ ${tc}">${tl}</span>
      </div>`);
      }
      h.push(`</div></div>`);
    }

    for (const [src, imps] of Object.entries(int)) {
      h.push(`<div class="imp-group">
      <div class="imp-group-h">
        <span style="color:var(--green)">📄</span>
        <span class="pkg">${Core.escapeHtml(src)}</span>
        <span class="badge">${imps.length}</span>
      </div>
      <div class="imp-group-b">`);
      for (const im of imps) {
        const tc = getTypeClass(im.type);
        const tl = getTypeLabel(im.type);
        const showLocal = im.localName !== im.importedName;
        h.push(`<div class="imp-row">
        <span class="from">${Core.escapeHtml(im.importedName)}</span>
        ${showLocal ? `<span class="arrow">→</span><span class="to">${Core.escapeHtml(im.localName)}</span>` : ''}
        <span class="typ ${tc}">${tl}</span>
      </div>`);
      }
      h.push(`</div></div>`);
    }

    return h.join('');
  }

  function renderImportersBlock(importers) {
    if (!importers.length) return '<div class="imp-empty">Никто не импортирует</div>';
    const grouped = {};
    for (const imp of importers) {
      const fid = imp.fromFileId || imp;
      if (!grouped[fid]) grouped[fid] = [];
      if (imp.fromFileId) grouped[fid].push(imp);
    }
    const h = [];
    for (const [fid, imps] of Object.entries(grouped)) {
      const ff = state.files[fid];
      h.push(`<div class="imp-group">
      <div class="imp-group-h">
        <span style="color:var(--orange)">📄</span>
        <span class="pkg">${Core.escapeHtml(ff?.path || fid)}</span>
        <span class="badge">${imps.length || '—'}</span>
      </div>
      ${imps.length ? `<div class="imp-group-b">
        ${imps.map(im => {
        const tc = getTypeClass(im.type);
        const tl = getTypeLabel(im.type);
        const showLocal = im.localName !== im.importedName;
        return `<div class="imp-row">
            <span class="from">${Core.escapeHtml(im.importedName)}</span>
            ${showLocal ? `<span class="arrow">→</span><span class="to">${Core.escapeHtml(im.localName)}</span>` : ''}
            <span class="typ ${tc}">${tl}</span>
          </div>`;
      }).join('')}
      </div>` : ''}
    </div>`);
    }
    return h.join('');
  }

  // ---------------------------------------------------------------------------
  // ДЕЛЕГИРОВАНИЕ
  // ---------------------------------------------------------------------------
  document.addEventListener('click', e => {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;
    const id = target.dataset.id;

    if (action === 'toggle-tm' || action === 'toggle-tf') {
      const caret = target.querySelector('.a');
      const next = target.nextElementSibling;
      if (caret) caret.classList.toggle('o');
      if (next) next.classList.toggle('o');
    }
    else if (action === 'select-fn') selectFn(id);
    else if (action === 'select-file') selectFile(id);
    else if (action === 'jump-fn') selectFn(id);
  });

  // ---------------------------------------------------------------------------
  // ГОРЯЧИЕ КЛАВИШИ
  // ---------------------------------------------------------------------------
  document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.key === 'k') { e.preventDefault(); $('si').focus(); }
    if (e.key === 'Escape') {
      const s = $('si');
      if (s) { s.value = ''; s.blur(); }
    }
  });

  console.log('%c🔍 AST Analyzer v9 — граф-инспектор', 'font-size:16px; font-weight:bold; color:#58a6ff;');
</script>
</body>
</html>
