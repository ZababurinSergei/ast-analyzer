<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔍 AST Analyzer — Инспектор графа v8</title>
  <style>
      :root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bg4:#30363d;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#58a6ff;--green:#3fb950;--yellow:#d29922;--red:#f85149;--purple:#bc8cff;--cyan:#39d353;--orange:#f0883e;--r:8px}
      *{margin:0;padding:0;box-sizing:border-box}
      body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
      .hdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
      .hdr h1{font-size:15px}.hdr .v{background:var(--accent);color:#000;padding:1px 7px;border-radius:9px;font-size:10px;font-weight:700}
      .hdr .sm{margin-left:auto;font-size:11px;color:var(--text2);display:flex;gap:8px}.hdr .sm b{color:var(--accent)}
      .hdr button{padding:4px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11px;cursor:pointer}
      .hdr button:hover{border-color:var(--accent)}
      .lay{display:flex;flex:1;overflow:hidden}
      .sb{width:300px;min-width:300px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column}
      .sb-h{padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600}
      .sb-s{padding:6px 10px;border-bottom:1px solid var(--border)}
      .sb-s input{width:100%;padding:5px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:11px;outline:none}
      .sb-t{flex:1;overflow-y:auto;padding:6px;font-size:11px}
      .tm{margin-bottom:2px}
      .tm-h{padding:3px 6px;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:5px;font-weight:600}
      .tm-h:hover{background:var(--bg3)}
      .tm-h .a{font-size:9px;transition:transform .15s}.tm-h .a.o{transform:rotate(90deg)}
      .tf-l{padding-left:10px;display:none}.tf-l.o{display:block}
      .tf{padding:2px 6px;border-radius:3px;cursor:pointer;display:flex;align-items:center;gap:4px;color:var(--text2)}
      .tf:hover{background:var(--bg3);color:var(--text)}
      .tf .a{font-size:8px;transition:transform .15s}.tf .a.o{transform:rotate(90deg)}
      .tf.no-fn{color:var(--yellow)}
      .fn-l{padding-left:14px;display:none}.fn-l.o{display:block}
      .fn{padding:2px 6px;border-radius:3px;cursor:pointer;font-family:monospace;font-size:10px;color:var(--text2);display:flex;align-items:center;gap:4px}
      .fn:hover{background:var(--bg3);color:var(--text)}
      .fn.act{background:rgba(63,185,80,.12);color:var(--green);font-weight:700}
      .mn{flex:1;overflow-y:auto;padding:16px}
      .ctx{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center;font-size:11px}
      .ctx .c{padding:3px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:14px;cursor:pointer}
      .ctx .c:hover{border-color:var(--accent)}
      .ctx .ar{color:var(--text2)}
      .nc{text-align:center;margin-bottom:16px}
      .n-card{display:inline-block;background:var(--bg2);border:2px solid var(--accent);border-radius:10px;padding:14px 24px;box-shadow:0 0 16px rgba(88,166,255,.15)}
      .n-card .nm{font-size:18px;font-weight:700;font-family:monospace}
      .n-card .mt{font-size:11px;color:var(--text2);margin-top:4px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
      .n-card .bd{margin-top:6px;display:flex;gap:3px;justify-content:center;flex-wrap:wrap}
      .b{display:inline-block;padding:1px 7px;border-radius:8px;font-size:9px;font-weight:600}
      .b.e{background:rgba(63,185,80,.2);color:var(--green)}
      .b.a{background:rgba(188,140,255,.2);color:var(--purple)}
      .b.m{background:rgba(210,153,34,.2);color:var(--yellow)}
      .b.r{background:rgba(88,166,255,.2);color:var(--accent)}
      .fv{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:14px}
      .fv .t{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:6px}
      .fv .fl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
      .fv .ar{color:var(--accent);font-size:14px}
      .fv .p{padding:3px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:14px;font-size:10px;font-family:monospace;cursor:pointer}
      .fv .p:hover{border-color:var(--accent)}
      .fv .p.ctr{background:rgba(88,166,255,.12);border-color:var(--accent);font-weight:700}
      .eg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
      .eg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
      @media(max-width:900px){.eg,.eg3{grid-template-columns:1fr}}
      .es{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
      .es-h{padding:8px 12px;background:var(--bg3);border-bottom:1px solid var(--border);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
      .es-h .ct{background:var(--bg4);padding:1px 7px;border-radius:8px;font-size:10px}
      .es-b{padding:8px;max-height:320px;overflow-y:auto}
      .ei{padding:5px 8px;border-radius:5px;margin-bottom:3px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:11px}
      .ei:hover{background:var(--bg3)}
      .ei .d{font-weight:bold;font-size:13px;flex-shrink:0}
      .ei .d.i{color:var(--green)}.ei .d.o{color:var(--red)}.ei .d.s{color:var(--yellow)}
      .ei .n{font-family:monospace;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .ei .inf{color:var(--text2);font-size:10px;white-space:nowrap;margin-left:auto}
      .imp-group{margin-bottom:6px;border:1px solid var(--border);border-radius:6px;overflow:hidden}
      .imp-group-h{padding:5px 8px;background:var(--bg4);font-size:11px;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer}
      .imp-group-h:hover{background:var(--bg3)}
      .imp-group-h .pkg{font-family:monospace;color:var(--accent);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .imp-group-h .badge{font-size:9px;padding:1px 5px;border-radius:6px;background:var(--bg3);color:var(--text2)}
      .imp-group-b{padding:4px 8px;background:var(--bg2)}
      .imp-row{display:flex;align-items:center;gap:6px;padding:3px 4px;font-size:10px;font-family:monospace;border-radius:4px}
      .imp-row:hover{background:var(--bg3)}
      .imp-row .arrow{color:var(--accent);font-size:11px}
      .imp-row .from{color:var(--purple)}
      .imp-row .to{color:var(--green)}
      .imp-row .typ{font-size:8px;padding:1px 4px;border-radius:4px;margin-left:auto;flex-shrink:0}
      .imp-row .typ.def{background:rgba(188,140,255,.15);color:var(--purple)}
      .imp-row .typ.nmd{background:rgba(88,166,255,.15);color:var(--accent)}
      .imp-row .typ.nsp{background:rgba(240,136,62,.15);color:var(--orange)}
      .imp-row .typ.typ{background:rgba(210,153,34,.15);color:var(--yellow)}
      .imp-empty{color:var(--text2);font-size:10px;padding:6px 8px}
      .eh{text-align:center;padding:50px;color:var(--text2)}
      .eh .ic{font-size:40px;margin-bottom:10px}
      .drop{border:2px dashed var(--border);border-radius:12px;padding:40px;text-align:center;margin:20px;cursor:pointer}
      .drop:hover{border-color:var(--accent)}
      .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;margin:2px}
      .tag.g{background:rgba(63,185,80,.15);color:var(--green)}
      .tag.b{background:rgba(88,166,255,.15);color:var(--accent)}
      .tag.y{background:rgba(210,153,34,.15);color:var(--yellow)}
      .tag.p{background:rgba(188,140,255,.15);color:var(--purple)}
      .tag.r{background:rgba(248,81,73,.15);color:var(--red)}
      ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
  </style>
</head>
<body>
<div class="hdr">
  <h1>🔍 AST Analyzer</h1><span class="v">v8.0.0</span>
  <div class="sm" id="sm"></div>
  <button id="btnOpen">📂 Открыть JSON</button>
  <input type="file" id="fi" accept=".json" style="display:none">
</div>
<div id="dropZone" class="drop">
  <div style="font-size:40px;margin-bottom:10px">📦</div>
  <strong>Перетащите index.full.json.json или нажмите для выбора</strong>
</div>
<div id="app" class="lay" style="display:none">
  <div class="sb">
    <div class="sb-h">📂 Навигация по графу</div>
    <div class="sb-s"><input id="si" placeholder="Поиск функции или файла..."/></div>
    <div class="sb-t" id="st"></div>
  </div>
  <div class="mn" id="mn">
    <div class="eh"><div class="ic">🎯</div><p>Выберите функцию или файл из дерева</p></div>
  </div>
</div>
<script>
  var D=null,AF=null,AF_FILE=null;

  function loadFile(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){try{D=JSON.parse(ev.target.result);init()}catch(err){alert('Ошибка парсинга: '+err.message)}};r.readAsText(f)}
  document.addEventListener('DOMContentLoaded',function(){
    document.getElementById('btnOpen').addEventListener('click',function(){document.getElementById('fi').click()});
    document.getElementById('dropZone').addEventListener('click',function(){document.getElementById('fi').click()});
    document.getElementById('fi').addEventListener('change',loadFile);
    document.addEventListener('dragover',function(e){e.preventDefault()});
    document.addEventListener('drop',function(e){
      e.preventDefault();
      var f=e.dataTransfer.files[0];
      if(f&&f.name.endsWith('.json')){var r=new FileReader();r.onload=function(ev){try{D=JSON.parse(ev.target.result);init()}catch(err){alert('Ошибка: '+err.message)}};r.readAsText(f)}
    });
    document.getElementById('si').addEventListener('input',function(){
      var q=this.value.toLowerCase();
      var all=document.querySelectorAll('.fn,.tf');
      for(var i=0;i<all.length;i++){all[i].style.display=all[i].textContent.toLowerCase().indexOf(q)>=0?'':'none'}
      if(q){
        var lists=document.querySelectorAll('.tf-l,.fn-l');
        for(var j=0;j<lists.length;j++)lists[j].classList.add('o');
        var arrows=document.querySelectorAll('.a');
        for(var k=0;k<arrows.length;k++)arrows[k].classList.add('o');
      }
    });
    document.addEventListener('keydown',function(e){
      if(e.ctrlKey&&e.key==='k'){e.preventDefault();document.getElementById('si').focus()}
      if(e.key==='Escape'){var s=document.getElementById('si');if(s){s.value='';s.blur()}}
    });
  });

  function init(){
    document.getElementById('dropZone').style.display='none';
    document.getElementById('app').style.display='flex';
    var s=D.statistics||{};
    document.getElementById('sm').innerHTML='<span>📦<b>'+(s.totalModules||0)+'</b></span><span>📄<b>'+(s.totalFiles||0)+'</b></span><span>ƒ<b>'+(s.totalFunctions||0)+'</b></span><span>🏛️<b>'+(s.totalClasses||0)+'</b></span><span>📞<b>'+(s.totalCalls||0)+'</b></span><span>🔗<b>'+(s.totalImports||0)+'</b></span><span>📤<b>'+(s.totalExports||0)+'</b></span><span>🔄<b>'+(s.totalReExports||0)+'</b></span>';
    renderTree();
    if(D.functions&&D.functions.length)sel(D.functions[0].id);
  }

  function gf(id){var a=D.files||[];for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}
  function gm(id){var a=D.modules||[];for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}
  function gfn(id){var a=D.functions||[];for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}
  function fnm(id){if(id.indexOf('external:')===0)return '⚡'+id.replace('external:','');var f=gfn(id);return f?f.name:id}
  function sp(p){var a=p.split('/');return a.length>2?'…/'+a.slice(-2).join('/'):p}

  /* ===================== ДЕРЕВО НАВИГАЦИИ ===================== */
  function renderTree(){
    var h='';
    var mods=D.modules||[];
    for(var mi=0;mi<mods.length;mi++){
      var m=mods[mi];
      var fs=(D.files||[]).filter(function(f){return f.moduleId===m.id});
      h+='<div class="tm"><div class="tm-h" onclick="tgl(this)"><span class="a">▶</span>📦'+m.name+'<span style="color:var(--text2);font-size:9px;margin-left:auto">'+fs.length+'</span></div><div class="tf-l">';
      for(var fi=0;fi<fs.length;fi++){
        var f=fs[fi];
        var fns=(D.functions||[]).filter(function(x){return x.fileId===f.id});
        if(fns.length>0){
          h+='<div class="tf" onclick="tgl(this)"><span class="a">▶</span>📄'+f.path.split('/').pop()+'<span style="font-size:9px;color:var(--text2)">('+fns.length+')</span></div><div class="fn-l">';
          fns.sort(function(a,b){return(a.line||0)-(b.line||0)});
          for(var fni=0;fni<fns.length;fni++){
            var fn=fns[fni];
            h+='<div class="fn" id="x-'+fn.id+'" onclick="sel(\''+fn.id+'\')">ƒ '+fn.name+'<span style="font-size:8px;color:var(--text2)">L'+(fn.line||0)+'</span></div>';
          }
          h+='</div>';
        }else{
          /* Файл без функций — показываем как кликабельный (реэкспорты) */
          h+='<div class="tf no-fn" id="xf-'+f.id+'" onclick="selFile(\''+f.id+'\')">📄'+f.path.split('/').pop()+'<span style="font-size:9px;color:var(--yellow);margin-left:auto">⇢ реэкспорты</span></div>';
        }
      }
      h+='</div></div>';
    }
    document.getElementById('st').innerHTML=h;
  }
  function tgl(el){var a=el.querySelector('.a');var nx=el.nextElementSibling;if(a)a.classList.toggle('o');if(nx)nx.classList.toggle('o')}

  /* ===================== ВЫБОР ФУНКЦИИ ===================== */
  function sel(id){
    AF=id;AF_FILE=null;
    var all=document.querySelectorAll('.fn');
    for(var i=0;i<all.length;i++)all[i].classList.remove('act');
    var el=document.getElementById('x-'+id);
    if(el){el.classList.add('act');el.scrollIntoView({block:'nearest'});
      var p=el.parentElement;
      while(p){if(p.classList.contains('fn-l')||p.classList.contains('tf-l')){p.classList.add('o');var a=p.previousElementSibling?p.previousElementSibling.querySelector('.a'):null;if(a)a.classList.add('o')}p=p.parentElement}
    }
    renderNode(id);
  }

  /* ===================== ВЫБОР ФАЙЛА (реэкспорты) ===================== */
  function selFile(fid){
    AF=null;AF_FILE=fid;
    var el=document.getElementById('xf-'+fid);
    if(el){el.scrollIntoView({block:'nearest'})}
    renderFileExports(fid);
  }

  /* ===================== РЕНДЕР ФАЙЛА: ГРАФ ЭКСПОРТОВ ===================== */
  function renderFileExports(fid){
    var file=gf(fid);if(!file)return;
    var mod=gm(file.moduleId);
    /* Прямые экспорты файла */
    var directExports=(D.exports||[]).filter(function(e){return e.fileId===fid});
    /* Реэкспорты модуля — привязываем через moduleId */
    var modReExports=(D.reExports||[]).filter(function(r){return r.moduleId===file.moduleId});
    /* Импорты файла (что он потребляет для реэкспорта) */
    var fileImports=(D.imports||[]).filter(function(i){return i.fromFileId===fid});
    /* Кто импортирует из файла */
    var fileImporters=(D.imports||[]).filter(function(i){return i.toFileId===fid});
    /* Кто реэкспортирует ИЗ этого файла: ищем по имени файла в source */
    var fileBase=file.path.split('/').pop().replace('.ts','').replace('.js','');
    var reExportsFrom=(D.reExports||[]).filter(function(r){
      if(!r.source)return false;
      var sn=r.source.replace('./','').replace('.js','').replace('.ts','');
      var snParts=sn.split('/');
      return snParts[snParts.length-1]===fileBase;
    });

    var h='<div>';
    h+='<div class="ctx"><span class="c">📦 '+(mod?mod.name:'?')+'</span><span class="ar">→</span><span class="c" style="border-color:var(--yellow);color:var(--yellow)">📄 '+file.path+'</span></div>';
    h+='<div class="nc"><div class="n-card"><div class="nm">📄 '+file.path+'</div><div class="mt"><span>Модуль: '+(mod?mod.name:'?')+'</span><span>Экспортов: '+directExports.length+'</span><span>Реэкспортов: '+modReExports.length+'</span><span>Импортов: '+fileImports.length+'</span></div></div></div>';

    /* === ГРАФ ЭКСПОРТОВ === */
    h+='<div class="eg">';

    /* 1. Прямые экспорты */
    h+='<div class="es"><div class="es-h">📤 Прямые экспорты файла <span class="ct">'+directExports.length+'</span></div><div class="es-b">';
    if(directExports.length){
      for(var i=0;i<directExports.length;i++){
        var ex=directExports[i];
        var fn=gfn(ex.functionId);
        h+='<div class="ei" onclick="'+(fn?'sel(\''+fn.id+'\')':'')+'"><span class="d" style="color:var(--green)">📤</span><span class="n">'+ex.exportName+'</span><span class="inf">'+ex.type+(ex.isTypeOnly?' · type':'')+'</span></div>';
      }
    }else{
      h+='<div class="imp-empty">Нет прямых экспортов — файл содержит только реэкспорты</div>';
    }
    h+='</div></div>';

    /* 2. Реэкспорты модуля */
    h+='<div class="es"><div class="es-h">🔄 Реэкспорты модуля <span class="ct">'+modReExports.length+'</span></div><div class="es-b">';
    if(modReExports.length){
      /* Группируем по source */
      var bySource={};
      for(var i=0;i<modReExports.length;i++){
        var re=modReExports[i];
        var src=re.source||'?';
        if(!bySource[src])bySource[src]=[];
        bySource[src].push(re);
      }
      var srcKeys=Object.keys(bySource);
      for(var si=0;si<srcKeys.length;si++){
        var src=srcKeys[si];var res=bySource[src];
        h+='<div class="imp-group"><div class="imp-group-h"><span style="color:var(--yellow)">🔄</span><span class="pkg">'+src+'</span><span class="badge">'+res.length+'</span></div><div class="imp-group-b">';
        for(var ri=0;ri<res.length;ri++){
          var re=res[ri];
          var fn=re.functionId?gfn(re.functionId):null;
          h+='<div class="imp-row" '+(fn?'onclick="sel(\''+fn.id+'\')" style="cursor:pointer"':'')+'><span class="from">'+re.exportName+'</span><span class="typ nmd">'+re.type+'</span></div>';
        }
        h+='</div></div>';
      }
    }else{
      h+='<div class="imp-empty">Нет реэкспортов</div>';
    }
    h+='</div></div>';

    /* 3. Импорты файла */
    h+='<div class="es"><div class="es-h">📥 Импорты файла <span class="ct">'+fileImports.length+'</span></div><div class="es-b">';
    if(fileImports.length){
      for(var i=0;i<fileImports.length;i++){
        var imp=fileImports[i];
        var toFile=gf(imp.toFileId);
        h+='<div class="ei"><span class="d" style="color:var(--cyan)">📥</span><span class="n">'+imp.importedName+'</span><span class="inf">'+(imp.isExternal?'ext:'+(imp.packageName||''):sp(imp.source||''))+'</span></div>';
      }
    }else{h+='<div class="imp-empty">Нет импортов</div>'}
    h+='</div></div>';

    /* 4. Кто импортирует из файла */
    h+='<div class="es"><div class="es-h">🔗 Импортируют файл <span class="ct">'+fileImporters.length+'</span></div><div class="es-b">';
    if(fileImporters.length){
      for(var i=0;i<fileImporters.length;i++){
        var imp=fileImporters[i];
        var fromFile=gf(imp.fromFileId);
        h+='<div class="ei"><span class="d" style="color:var(--orange)">📤</span><span class="n">'+(fromFile?sp(fromFile.path):imp.fromFileId)+'</span><span class="inf">'+imp.importedName+'</span></div>';
      }
    }else{h+='<div class="imp-empty">Никто не импортирует напрямую</div>'}
    h+='</div></div>';

    /* 5. Кто реэкспортирует ИЗ этого файла */
    h+='<div class="es"><div class="es-h">🔁 Реэкспортируют из файла <span class="ct">'+reExportsFrom.length+'</span></div><div class="es-b">';
    if(reExportsFrom.length){
      for(var i=0;i<reExportsFrom.length;i++){
        var re=reExportsFrom[i];
        var reMod=gm(re.moduleId);
        h+='<div class="ei"><span class="d" style="color:var(--purple)">🔄</span><span class="n">'+re.exportName+'</span><span class="inf">'+(reMod?reMod.name:'')+' ← '+re.source+'</span></div>';
      }
    }else{h+='<div class="imp-empty">Никто не реэкспортирует из этого файла</div>'}
    h+='</div></div>';

    /* 6. Соседние файлы модуля */
    var modFiles=(D.files||[]).filter(function(f){return f.moduleId===file.moduleId&&f.id!==fid});
    h+='<div class="es"><div class="es-h">📁 Файлы модуля <span class="ct">'+modFiles.length+'</span></div><div class="es-b">';
    for(var i=0;i<modFiles.length;i++){
      var mf=modFiles[i];
      var mfns=(D.functions||[]).filter(function(x){return x.fileId===mf.id});
      h+='<div class="ei" onclick="'+(mfns.length?'':'selFile(\''+mf.id+'\')')+'" style="cursor:pointer"><span class="d" style="color:var(--text2)">📄</span><span class="n">'+mf.path+'</span><span class="inf">'+(mfns.length?mfns.length+' ƒ':'реэкспорты')+'</span></div>';
    }
    h+='</div></div>';

    h+='</div></div>';
    document.getElementById('mn').innerHTML=h;
  }

  /* ===================== РЕНДЕР ФУНКЦИИ ===================== */
  function renderNode(id){
    var fn=gfn(id);if(!fn)return;
    var file=gf(fn.fileId),mod=gm(fn.moduleId);
    var calls=D.calls||[];
    var ins=[],outs=[];
    for(var i=0;i<calls.length;i++){
      if(calls[i].toFunctionId===id)ins.push(calls[i]);
      if(calls[i].fromFunctionId===id)outs.push(calls[i]);
    }
    var fImps=file?(D.imports||[]).filter(function(x){return x.fromFileId===file.id}):[];
    var fImporters=file?(D.imports||[]).filter(function(x){return x.toFileId===file.id}):[];
    var exps=(D.exports||[]).filter(function(x){return x.functionId===id});
    var sibs=file?(D.functions||[]).filter(function(x){return x.fileId===file.id&&x.id!==id}):[];
    var reExps=(D.reExports||[]).filter(function(x){return x.functionId===id});
    /* Граф экспортов файла */
    var fileExports=file?(D.exports||[]).filter(function(x){return x.fileId===file.id}):[];
    var fileReExports=file?(D.reExports||[]).filter(function(x){return x.moduleId===file.moduleId}):[];
    var fileImporters=file?(D.imports||[]).filter(function(x){return x.toFileId===file.id}):[];

    var bds=[];
    if(fn.isExported)bds.push('<span class="b e">export</span>');
    if(fn.isAsync)bds.push('<span class="b a">async</span>');
    if(fn.isMethod)bds.push('<span class="b m">method</span>');
    if(fn.isArrow)bds.push('<span class="b r">arrow</span>');
    var h='<div>';
    h+='<div class="ctx"><span class="c">📦 '+(mod?mod.name:'?')+'</span><span class="ar">→</span><span class="c" onclick="selFile(\''+(file?file.id:'')+'\')" style="cursor:pointer">📄 '+(file?file.path:'?')+'</span>'+(exps.length?'<span class="ar">→</span><span class="c" style="border-color:var(--green);color:var(--green)">📤 '+exps[0].exportName+'</span>':'')+'</div>';
    h+='<div class="nc"><div class="n-card"><div class="nm">ƒ '+fn.name+'</div><div class="mt"><span>📍 L'+(fn.line||0)+'</span>'+(fn.params&&fn.params.length?'<span>('+fn.params.join(', ')+')</span>':'')+(fn.returnType?'<span>→ '+fn.returnType.substring(0,60)+(fn.returnType.length>60?'…':'')+'</span>':'')+'</div><div class="bd">'+bds.join('')+'</div></div></div>';

    /* Поток вызовов */
    if(ins.length||outs.length){
      h+='<div class="fv"><div class="t">⚡ Поток вызовов</div><div class="fl">';
      for(var a=0;a<Math.min(ins.length,3);a++){
        h+='<span class="p" onclick="nav(\''+ins[a].fromFunctionId+'\')">'+fnm(ins[a].fromFunctionId)+'</span><span class="ar">→</span>';
      }
      h+='<span class="p ctr">'+fn.name+'</span>';
      for(var b=0;b<Math.min(outs.length,3);b++){
        h+='<span class="ar">→</span><span class="p" onclick="nav(\''+outs[b].toFunctionId+'\')">'+fnm(outs[b].toFunctionId)+'</span>';
      }
      h+='</div></div>';
    }

    h+='<div class="eg">';
    /* Входы */
    h+='<div class="es"><div class="es-h">📥 Входы — кто вызывает <span class="ct">'+ins.length+'</span></div><div class="es-b">';
    if(ins.length){
      for(var c=0;c<ins.length;c++){
        h+='<div class="ei" onclick="nav(\''+ins[c].fromFunctionId+'\')"><span class="d i">←</span><span class="n">'+fnm(ins[c].fromFunctionId)+'</span><span class="inf">'+(ins[c].type||'direct')+'·L'+(ins[c].line||0)+'</span></div>';
      }
    }else{h+='<div class="imp-empty">Нет входящих вызовов</div>'}
    h+='</div></div>';
    /* Выходы */
    h+='<div class="es"><div class="es-h">📤 Выходы — что вызывает <span class="ct">'+outs.length+'</span></div><div class="es-b">';
    if(outs.length){
      for(var d2=0;d2<outs.length;d2++){
        var isExt=outs[d2].toFunctionId.indexOf('external:')===0;
        h+='<div class="ei" '+(isExt?'':'onclick="nav(\''+outs[d2].toFunctionId+'\')"')+'><span class="d o">→</span><span class="n">'+fnm(outs[d2].toFunctionId)+'</span><span class="inf">'+(outs[d2].type||'direct')+'·L'+(outs[d2].line||0)+(isExt?'·⚡ext':'')+'</span></div>';
      }
    }else{h+='<div class="imp-empty">Нет исходящих вызовов</div>'}
    h+='</div></div>';
    /* Импорты файла */
    h+='<div class="es"><div class="es-h">📦 Импорты файла <span class="ct">'+fImps.length+'</span></div><div class="es-b">'+renderImportsBlock(fImps)+'</div></div>';
    /* Импортируют файл */
    h+='<div class="es"><div class="es-h">🔗 Импортируют файл <span class="ct">'+fImporters.length+'</span></div><div class="es-b">'+renderImportersBlock(fImporters)+'</div></div>';
    /* Соседи */
    h+='<div class="es"><div class="es-h">👥 Соседи по файлу <span class="ct">'+sibs.length+'</span></div><div class="es-b">';
    if(sibs.length){
      for(var e2=0;e2<Math.min(sibs.length,10);e2++){
        h+='<div class="ei" onclick="sel(\''+sibs[e2].id+'\')"><span class="d s">ƒ</span><span class="n">'+sibs[e2].name+'</span><span class="inf">L'+(sibs[e2].line||0)+(sibs[e2].isExported?'·exp':'')+'</span></div>';
      }
      if(sibs.length>10)h+='<div class="imp-empty">…ещё '+(sibs.length-10)+'</div>';
    }else{h+='<div class="imp-empty">Единственная функция в файле</div>'}
    h+='</div></div>';
    /* Реэкспорты функции */
    if(reExps.length){
      h+='<div class="es"><div class="es-h">🔄 Реэкспорты функции <span class="ct">'+reExps.length+'</span></div><div class="es-b">';
      for(var r=0;r<reExps.length;r++){
        var rm=gm(reExps[r].moduleId);
        h+='<div class="ei"><span class="d" style="color:var(--yellow)">🔄</span><span class="n">'+reExps[r].exportName+'</span><span class="inf">'+(rm?rm.name:'')+'·'+(reExps[r].source||'')+(reExps[r].isStarReExport?' *':'')+'</span></div>';
      }
      h+='</div></div>';
    }
    /* ГРАФ ЭКСПОРТОВ ФАЙЛА */
    h+='<div class="es"><div class="es-h">📊 Граф экспортов файла <span class="ct">'+(fileExports.length+fileReExports.length)+'</span></div><div class="es-b">';
    h+='<div style="font-size:9px;color:var(--text2);padding:2px 4px;font-weight:600">📤 ПРЯМЫЕ ЭКСПОРТЫ ('+fileExports.length+')</div>';
    if(fileExports.length){
      for(var i=0;i<fileExports.length;i++){
        var ex=fileExports[i];
        var efn=gfn(ex.functionId);
        h+='<div class="ei" onclick="'+(efn?'sel(\''+efn.id+'\')':'')+'"><span class="d" style="color:var(--green)">📤</span><span class="n">'+ex.exportName+'</span><span class="inf">'+ex.type+'</span></div>';
      }
    }else{h+='<div class="imp-empty">Нет прямых экспортов</div>'}
    h+='<div style="font-size:9px;color:var(--text2);padding:4px 4px 2px;font-weight:600">🔄 РЕЭКСПОРТЫ МОДУЛЯ ('+fileReExports.length+')</div>';
    if(fileReExports.length){
      for(var i=0;i<Math.min(fileReExports.length,15);i++){
        var re=fileReExports[i];
        var rfn=gfn(re.functionId);
        h+='<div class="ei" onclick="'+(rfn?'sel(\''+rfn.id+'\')':'')+'"><span class="d" style="color:var(--yellow)">🔄</span><span class="n">'+re.exportName+'</span><span class="inf">'+re.source+'</span></div>';
      }
      if(fileReExports.length>15)h+='<div class="imp-empty">…ещё '+(fileReExports.length-15)+'</div>';
    }else{h+='<div class="imp-empty">Нет реэкспортов</div>'}
    h+='</div></div>';
    h+='</div></div>';
    document.getElementById('mn').innerHTML=h;
  }

  function nav(id){if(id.indexOf('external:')===0)return;if(gfn(id))sel(id)}

  /* ===================== БЛОК ИМПОРТОВ ===================== */
  function renderImportsBlock(fileImports){
    if(!fileImports.length)return '<div class="imp-empty">Нет импортов</div>';
    var ext={},int={};
    for(var i=0;i<fileImports.length;i++){
      var imp=fileImports[i];
      if(imp.isExternal){var k=imp.packageName||imp.source;if(!ext[k])ext[k]=[];ext[k].push(imp)}
      else{if(!int[imp.source])int[imp.source]=[];int[imp.source].push(imp)}
    }
    var h='';
    var extKeys=Object.keys(ext);
    if(extKeys.length){
      h+='<div style="font-size:9px;color:var(--text2);padding:2px 4px;font-weight:600">🌐 ВНЕШНИЕ ПАКЕТЫ ('+extKeys.length+')</div>';
      for(var ei=0;ei<extKeys.length;ei++){
        var pkg=extKeys[ei];var imps=ext[pkg];
        h+='<div class="imp-group"><div class="imp-group-h"><span style="color:var(--purple)">📦</span><span class="pkg">'+pkg+'</span><span class="badge">'+imps.length+'</span></div><div class="imp-group-b">';
        for(var j=0;j<imps.length;j++){
          var im=imps[j];
          var tc=im.type==='default'?'def':im.type==='namespace'?'nsp':im.type==='type-only'?'typ':'nmd';
          var tl=im.type==='default'?'default':im.type==='namespace'?'namespace':im.type==='type-only'?'type':'named';
          var showLocal=im.localName!==im.importedName;
          h+='<div class="imp-row"><span class="from">'+im.importedName+'</span>'+(showLocal?'<span class="arrow">→</span><span class="to">'+im.localName+'</span>':'')+'<span class="typ '+tc+'">'+tl+'</span></div>';
        }
        h+='</div></div>';
      }
    }
    var intKeys=Object.keys(int);
    if(intKeys.length){
      h+='<div style="font-size:9px;color:var(--text2);padding:4px 4px 2px;font-weight:600">📁 ВНУТРЕННИЕ ФАЙЛЫ ('+intKeys.length+')</div>';
      for(var ii=0;ii<intKeys.length;ii++){
        var src=intKeys[ii];var imps2=int[src];
        h+='<div class="imp-group"><div class="imp-group-h"><span style="color:var(--green)">📄</span><span class="pkg">'+src+'</span><span class="badge">'+imps2.length+'</span></div><div class="imp-group-b">';
        for(var k=0;k<imps2.length;k++){
          var im2=imps2[k];
          var tc2=im2.type==='default'?'def':im2.type==='namespace'?'nsp':im2.type==='type-only'?'typ':'nmd';
          var tl2=im2.type==='default'?'default':im2.type==='namespace'?'namespace':im2.type==='type-only'?'type':'named';
          var showLocal2=im2.localName!==im2.importedName;
          h+='<div class="imp-row"><span class="from">'+im2.importedName+'</span>'+(showLocal2?'<span class="arrow">→</span><span class="to">'+im2.localName+'</span>':'')+'<span class="typ '+tc2+'">'+tl2+'</span></div>';
        }
        h+='</div></div>';
      }
    }
    return h;
  }
  function renderImportersBlock(fileImporters){
    if(!fileImporters.length)return '<div class="imp-empty">Никто не импортирует</div>';
    var grouped={};
    for(var i=0;i<fileImporters.length;i++){
      var imp=fileImporters[i];
      var k=imp.fromFileId;
      if(!grouped[k])grouped[k]=[];
      grouped[k].push(imp);
    }
    var h='<div style="font-size:9px;color:var(--text2);padding:2px 4px;font-weight:600">Файлы-потребители ('+Object.keys(grouped).length+')</div>';
    var keys=Object.keys(grouped);
    for(var gi=0;gi<keys.length;gi++){
      var fid=keys[gi];var imps=grouped[fid];
      var ff=gf(fid);
      h+='<div class="imp-group"><div class="imp-group-h"><span style="color:var(--orange)">📄</span><span class="pkg">'+(ff?ff.path:fid)+'</span><span class="badge">'+imps.length+'</span></div><div class="imp-group-b">';
      for(var j=0;j<imps.length;j++){
        var im=imps[j];
        var tc=im.type==='default'?'def':im.type==='namespace'?'nsp':im.type==='type-only'?'typ':'nmd';
        var tl=im.type==='default'?'default':im.type==='namespace'?'namespace':im.type==='type-only'?'type':'named';
        var showLocal=im.localName!==im.importedName;
        h+='<div class="imp-row"><span class="from">'+im.importedName+'</span>'+(showLocal?'<span class="arrow">→</span><span class="to">'+im.localName+'</span>':'')+'<span class="typ '+tc+'">'+tl+'</span></div>';
      }
      h+='</div></div>';
    }
    return h;
  }
</script>
</body>
</html>
